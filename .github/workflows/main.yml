name: Deploy Web C3 Playground

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out host repository
        uses: actions/checkout@v7

      - name: Clone C3 Compiler & Checkout PR 3415
        run: |
          git clone https://github.com/c3lang/c3c.git c3c
          cd c3c

          if git fetch origin pull/3415/head:pr-3415; then
            git checkout pr-3415
            echo "Successfully checked out and applied PR 3415"
          else
            echo "PR 3415 fetch failed or already merged. Proceeding with default branch."
          fi

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup Emscripten (WebAssembly Compiler)
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "latest"
          actions-cache-folder: "emsdk-cache"

      - name: Build Web Compiler
        shell: bash
        run: ./build.sh Release latest

      - name: Run Integration Tests
        run: node c3-worker.js

      - name: Copy Favicon to dist
        run: cp favicon.svg dist/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5