<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>C3 Playground</title>
	<link rel="icon" type="image/svg+xml" href="./favicon.svg">
	<style>
		:root {
			--bg-dark: #0f172a;
			--panel-bg: #1e293b;
			--border: #334155;
			--accent: #38bdf8;
			--accent-hover: #0284c7;
			--text-main: #f8fafc;
			--text-muted: #94a3b8;
			--console-bg: #090d16;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: var(--bg-dark);
			color: var(--text-main);
			height: 100vh;
			display: flex;
			flex-direction: column;
		}

		header {
			background-color: var(--panel-bg);
			border-bottom: 1px solid var(--border);
			padding: 12px 24px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		header h1 img {
			height: 50px;
			width: auto;
		}

		header h1 {
			font-size: 1.25rem;
			font-weight: 600;
			color: var(--accent);
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
		}

		/* Documentation Link Style */
		.docs-link {
			font-size: 0.85rem;
			color: var(--text-muted);
			text-decoration: none;
			font-weight: normal;
			display: inline-flex;
			align-items: center;
			gap: 4px;
			transition: color 0.2s ease;
		}

		.docs-link:hover {
			color: var(--accent);
		}

		.controls {
			display: flex;
			gap: 12px;
			align-items: center;
		}

		select,
		button {
			font-size: 0.9rem;
			padding: 8px 16px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--bg-dark);
			color: var(--text-main);
			cursor: pointer;
			transition: all 0.2s ease;
		}

		select:focus,
		button:focus {
			outline: none;
			border-color: var(--accent);
		}

		button.primary {
			background-color: var(--accent);
			color: #0f172a;
			font-weight: 600;
			border: none;
		}

		button.primary:hover:not(:disabled) {
			background-color: var(--accent-hover);
			color: #fff;
		}

		button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		/* Status Badge & Custom Monospaced Tooltip Container */
		.status-container {
			position: relative;
			display: inline-flex;
			align-items: center;
		}

		.status-badge {
			font-size: 0.8rem;
			padding: 4px 8px;
			border-radius: 12px;
			background: #334155;
			color: var(--text-muted);
			transition: all 0.2s ease;
			user-select: none;
		}

		.status-badge.ready {
			background: #064e3b;
			color: #34d399;
			cursor: pointer;
		}

		.status-badge.ready:hover {
			background: #047857;
			color: #10b981;
		}

		.status-badge.compiling {
			background: #78350f;
			color: #fbbf24;
		}

		/* Custom HTML/CSS Tooltip (Positioned below the badge to prevent page overflow) */
		.status-tooltip {
			opacity: 0;
			visibility: hidden;
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			background-color: #0b1329;
			border: 1px solid var(--border);
			color: #e2e8f0;
			padding: 12px;
			border-radius: 6px;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 0.75rem;
			line-height: 1.5;
			white-space: pre;
			z-index: 1000;
			box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.6), 0 4px 6px -4px rgba(0, 0, 0, 0.6);
			pointer-events: none;
			transition: opacity 0.2s ease, visibility 0.2s ease;
		}

		.status-container:hover .status-badge.ready~.status-tooltip {
			opacity: 1;
			visibility: visible;
		}

		/* Compiler Settings Popover */
		.settings-container {
			position: relative;
			display: inline-flex;
			align-items: center;
		}

		.settings-btn {
			padding: 8px;
			background: var(--bg-dark);
			border: 1px solid var(--border);
			border-radius: 6px;
			color: var(--text-main);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.settings-btn:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		.settings-popover {
			display: none;
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			width: 320px;
			background: #0b1329;
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 16px;
			z-index: 1000;
			box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
			flex-direction: column;
			gap: 8px;
		}

		.settings-popover.active {
			display: flex;
		}

		.popover-header {
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--accent);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-bottom: 2px;
		}

		.settings-popover label {
			font-size: 0.8rem;
			color: var(--text-muted);
		}

		.settings-popover input {
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 0.85rem;
			padding: 8px 10px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--panel-bg);
			color: var(--text-main);
			width: 100%;
		}

		.settings-popover input:focus {
			outline: none;
			border-color: var(--accent);
		}

		.popover-help {
			font-size: 0.75rem;
			color: var(--text-muted);
			line-height: 1.4;
		}

		main {
			flex: 1;
			display: grid;
			grid-template-columns: 1fr 10px 1fr;
			padding: 12px;
			overflow: hidden;
			box-sizing: border-box;
		}

		.pane {
			background: var(--panel-bg);
			border: 1px solid var(--border);
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		/* Resizer Drag Handle Styling */
		.resizer {
			width: 10px;
			cursor: col-resize;
			background: transparent;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 10;
			user-select: none;
		}

		.resizer::after {
			content: "";
			width: 2px;
			height: 40px;
			background-color: var(--border);
			border-radius: 1px;
			transition: background-color 0.2s ease, height 0.2s ease, width 0.2s ease;
		}

		.resizer:hover::after,
		.resizer.dragging::after {
			background-color: var(--accent);
			height: 100%;
		}

		.pane-header {
			background: rgba(15, 23, 42, 0.4);
			padding: 8px 16px;
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--text-muted);
			border-bottom: 1px solid var(--border);
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		/* Editor Action Controls */
		.editor-actions {
			display: flex;
			gap: 8px;
		}

		.icon-btn {
			background: transparent;
			border: none;
			color: var(--text-muted);
			padding: 4px;
			cursor: pointer;
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s ease;
		}

		.icon-btn:hover {
			color: var(--accent);
			background: rgba(56, 189, 248, 0.1);
		}

		.icon-btn svg {
			width: 16px;
			height: 16px;
		}

		#code {
			flex: 1;
			width: 100%;
			min-height: 0;
		}

		pre {
			flex: 1;
			background: var(--console-bg);
			color: #38bdf8;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 13px;
			line-height: 1.5;
			padding: 16px;
			overflow-y: auto;
			white-space: pre-wrap;
			word-break: break-all;
			-webkit-overflow-scrolling: touch;
		}

		#canvasContainer {
			position: relative;
			display: none;
			background: #090d16;
			border-bottom: 1px solid var(--border);
			resize: vertical;
			overflow: hidden;
			height: 481px;
			min-height: 80px;
			max-height: 95%;
		}

		#canvasContainer:fullscreen {
			border: none;
			max-height: none;
			background: #000;
		}

		.canvas-wrapper {
			display: flex;
			width: 100%;
			height: 100%;
			padding: 6px;
			align-items: center;
			justify-content: center;
			box-sizing: border-box;
		}

		#canvas {
			background: #000;
			border: 1px solid var(--border);
			image-rendering: auto;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		/* Canvas Fullscreen Toggle Button */
		.canvas-fullscreen-btn {
			position: absolute;
			top: 12px;
			right: 12px;
			background: rgba(15, 23, 42, 0.85);
			border: 1px solid var(--border);
			color: var(--text-main);
			border-radius: 6px;
			padding: 6px;
			cursor: pointer;
			opacity: 0;
			transition: opacity 0.2s ease, background-color 0.2s ease, color 0.2s ease;
			z-index: 20;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		#canvasContainer:hover .canvas-fullscreen-btn {
			opacity: 1;
		}

		@media (hover: none), (pointer: coarse) {
			.canvas-fullscreen-btn {
				opacity: 1;
				background: rgba(15, 23, 42, 0.75);
			}
		}

		.canvas-fullscreen-btn:hover {
			background: var(--accent);
			color: #0f172a;
		}

		@media (max-width: 768px) {
			#canvasContainer {
				height: 140px;
			}
		}

		/* Clickable Compiler Links inside Output Console */
		.console-link:hover {
			text-decoration: underline !important;
			color: #0284c7 !important;
		}

		/* Responsive Mobile Layout Stack Rules */
		@media (max-width: 768px) {
			main {
				grid-template-columns: 1fr !important;
				grid-template-rows: 1fr 10px 1fr;
			}

			.resizer {
				width: 100%;
				height: 10px;
				cursor: row-resize;
			}

			.resizer::after {
				width: 40px;
				height: 2px;
			}

			.resizer:hover::after,
			.resizer.dragging::after {
				width: 100%;
				height: 2.2px;
			}
		}

		@media (max-width: 480px) {
			header {
				padding: 12px;
				flex-direction: column;
				gap: 12px;
				align-items: stretch;
			}

			.controls {
				width: 100%;
				justify-content: space-between;
			}

			select {
				flex: 1;
				max-width: 150px;
			}
		}
	</style>
</head>

<body>

	<script type="text/c3" data-name="Slices & Defer">module main;
import std;

fn void heap_example()
{
	io::printn("--- 1. Manual Allocation with 'defer' ---");
	// mem::new_array allocates a zero-initialized array (slice) on the heap.
	// Unlike standard C, this returns a safe, sized slice (int[]) rather than a raw pointer.
	int[] array = mem::new_array(int, 5);

	// 'defer' guarantees memory cleanup at scope exit, preventing leaks without RAII overhead
	defer mem::free(array);

	for (int i = 0; i < array.len; i++)
	{
		array[i] = (i + 1) * 10;
	}

	foreach (idx, val : array) // foreach loops work naturally on slices
	{
		io::printfn("array[%d] = %d", idx, val);
	}
}

fn void temp_example()
{
	io::printn("\n--- 2. Temporary Arena Allocation ---");
	// The @pool macro sets up a temporary allocator scope.
	// All temporary allocations within this block are automatically freed on block exit.
	@pool()
	{
		double[] temp_vals = mem::temp_array(double, 4); // Allocate a temporary double array using the arena allocator
		temp_vals[0] = 3.14;
		temp_vals[1] = 1.61;
		temp_vals[2] = 2.71;
		temp_vals[3] = 1.41;

		double[] sub_slice = temp_vals[1:2]; // Create a sub-slice on the fly using slice syntax [start:length]

		foreach (idx, val : sub_slice)
		{
			io::printfn("sub_slice[%d] = %.2f", idx, val);
		}

		io::printn("Leaving @pool scope... (all temp memory is automatically reclaimed)");
	};
}

fn void main()
{
	heap_example();
	temp_example();
}
</script>

	<script type="text/c3" data-name="Reflection">module main;
import std;

struct Point {
	int x;
	int y;
	double depth;
}

// Compile-time macro to introspect struct definitions
macro print_fields($Type) {
	$foreach $field : $Type::members:
		// Use dot notation (.) to access compile-time member properties
		io::printfn("Field '%s' | Offset: %d bytes | Size: %d bytes",
			$field.name, $field.offset, $field.size);
	$endforeach
}

fn int main()
{
	io::printn("--- 1. Type Metadata ---");
	// We can query compile-time type properties using the :: syntax
	io::printfn("Name:        %s", Point::name);
	io::printfn("Total Size:  %d bytes", Point::size);
	io::printfn("Is Struct?   %s", Point::kind == STRUCT ? "Yes" : "No");

	io::printn("\n--- 2. Struct Fields Reflection ---");
	// Generate code at compile-time that prints the layout
	print_fields(Point);

	return 0;
}
</script>

	<script type="text/c3" data-name="JSON Pretty Print">module main;
import std;

fn int main()
{
	String file = `
{"id":12345,"name":"Alice Johnson","email":"alice@example.com","active":true,"roles":["admin","editor"],"profile":{"city":"Buenos Aires","country":"Argentina"},"lastLogin":"2026-08-01T12:34:56Z","preferences":{"theme":"dark","notifications":true}}
`;

	Object*? json_object = json::tparse(file);
	if (catch err = json_object)
	{
		io::printfn("Error: Failed to parse JSON (%s)", err);
		return 1;
	}

	if (catch err = json::marshal_to(io::stdout(), json_object, SPACE_4))
	{
		io::printfn("Error: Failed to write pretty printed JSON (%s)", err);
		return 1;

import std;

faultdef INVALID_CHAR, OUT_OF_RANGE; // Custom faults are declared globally

fn int? parse_digit(char c) // This function returns an Optional int (either an int or a fault)
{
	if (c < '0' || c > '9') {
		return INVALID_CHAR~; // Use '~' to return a fault as an empty optional
	}
	return (int)(c - '0');
}

fn int? parse_and_double(char c)
{
	int digit = parse_digit(c)!; // The '!' operator propagates/bubbles up the fault if parse_digit fails
	return (digit > 4) ? OUT_OF_RANGE~! : digit * 2;
}

fn void main()
{
	char[3] test_chars = { '3', '7', 'a' };

	foreach (c : test_chars) {
		int? val = parse_and_double(c);

		// Unwrapping the optional cleanly with 'if (catch ...)'
		if (catch err = val)
		{
			io::printfn("Character '%c': Failed with error %s", c, err);
		}
		else
		{
			// Inside this block, 'val' is automatically unwrapped to a standard 'int'
			io::printfn("Character '%c': Success, doubled value is %d", c, val);
		}
	}
}

	<script type="text/c3" data-name="Brainfuck interpreter">module brainfk;
import std;

fn void main()
{
	String program = `
	++++[>+++++<-]>[<+++++>-]+<+[
		>[>+>+<<-]++>>[<<+>>-]>>>[-]++>[-]+
		>>>+[[-]++++++>>>]<<<[[<++++++++<++>>-]+<.<[>----<-]<]
		<<[>>>>>[>>>[-]+++++++++<[>-<-]+++++++++>[-[<->-]+[<<<]]<[>+<-]>]<<-]<<-
	]`;
	brainf(program)!!;
}

const BF_MEM = 30000;
char[BF_MEM] memory;

faultdef INTEPRET_FAILED;

fn void? print_error_type_at(sz pos, String err)
{
	io::printfn("Error at %s: %s", pos, err);
	return INTEPRET_FAILED~;
}

fn void? brainf(String program)
{
	sz sp = 0;
	sz mem = 0;
	while (sp < program.len)
	{
		char c = program[sp++];
		switch (c)
		{
			case '<':
				if (!mem) return print_error_type_at(sp, "Memory underflow");
				mem--;
			case '>':
				if (mem == BF_MEM - 1) return print_error_type_at(sp, "Memory overflow");
				mem++;
			case '+':
				memory[mem]++;
			case '-':
				memory[mem]--;
			case '.':
				io::putchar(memory[mem]);
				io::stdout().flush()!;
			case ',':
				memory[mem] = io::stdin().read_byte()!!;
			case '[':
				sz indent = 1;
				if (memory[mem]) continue;
				sz start = sp - 1;
				while (indent)
				{
					if (sp == program.len) return print_error_type_at(start, "No matching ']'");
					switch (program[sp++])
					{
						case ']': indent--;
						case '[': indent++;
						default: break;
					}
				}
			case ']':
				if (!memory[mem]) continue;
				sz start = sp--;
				sz indent = 1;
				while (indent)
				{
					if (!sp) return print_error_type_at(start, "No matching '['");
					switch (program[--sp])
					{
						case ']': indent++;
						case '[': indent--;
						default: break;
					}
				}
				sp++;
			default:
				break;
		}
	}
}

import std;

const int BUFFER_SIZE = 1024;
const double SAMPLE_RATE = 44100.0;
const int STEP_SAMPLES = 4900;
const float TWO_PI = 6.2831853f;

const float[16] BASS_NOTES = {
	55.0f,  55.0f,  110.0f, 55.0f,
	65.4f,  65.4f,  130.8f, 65.4f,
	82.4f,  82.4f,  164.8f, 82.4f,
	73.4f,  73.4f,  146.8f, 73.4f
};

const float[*] SOLO_SCALE = {
	220.0f, 261.6f, 293.7f, 329.6f, 392.0f, 440.0f, 523.3f
};

float[BUFFER_SIZE] audio_buffer;

float[<4>] amp;
float[<4>] decay = 0.9994f;
float[<4>] phase;

float solo_amp, solo_phase, solo_freq, solo_target_freq;

int sample_count;
int step;
float lfo_phase;

fn float* update_audio(int samples) @export("update_audio")
{
	for (int i = 0; i < samples; i++)
	{
		int bar = (sample_count / (STEP_SAMPLES * 16)) % 8;

		if (sample_count % STEP_SAMPLES == 0)
		{
			switch (step % 4)
			{
				case 0:  if (bar != 7) { amp.x = 0.7f; phase.x = 0.0f; }
				case 2:  if (bar >= 1) amp.y = 0.20f;
				case 1:
				case 3:  if (bar >= 1 && bar != 6) amp.y = 0.08f;
			}

			if (bar >= 2 && bar != 6) amp.z = 0.18f;
			if (bar >= 3 && step % 3 == 2) amp.w = 0.15f;

			if ((bar == 4 || bar == 5 || bar == 7) && rnd() < 0.70)
			{
				solo_target_freq = SOLO_SCALE[(int)(rnd() * SOLO_SCALE.len)];
				solo_amp = 0.30f;
			}

			step = (step + 1) % 16;
		}
		sample_count++;

		amp *= decay;
		solo_amp *= 0.9995f;

		lfo_phase += (TWO_PI * 1.5f) / SAMPLE_RATE;
		if (lfo_phase > TWO_PI) lfo_phase -= TWO_PI;

		solo_freq += (solo_target_freq - solo_freq) * 0.003f;
		float modulated_solo = solo_freq + math::sin(lfo_phase * 6.0f) * (solo_amp * 40.0f);

		float lead_base = BASS_NOTES[step];
		switch (bar)
		{
			case 4..5:  lead_base *= 2.0f;
			case 6:  lead_base *= 1.5f;
		}

		float lead_freq = lead_base + math::sin(lfo_phase) * 2.5f;

		float[<4>] phase_inc = { 150.0f * amp.x, 0.0f, BASS_NOTES[step], lead_freq };
		phase += phase_inc / SAMPLE_RATE;
		phase -= (int[<4>])phase;

		solo_phase += modulated_solo / SAMPLE_RATE;
		if (solo_phase > 1.0f) solo_phase -= 1.0f;

		float lead_wave = math::abs(phase.w * 2.0f - 1.0f) * 2.0f - 1.0f;
		float solo_wave = (solo_phase < 0.25f ? 0.6f : -0.6f) * solo_amp;

		float[<4>] voice_out = {
			math::sin(phase.x * TWO_PI),
			(float)rnd() * 2.0f - 1.0f,
			(phase.z < 0.5f ? 1.0f : -1.0f),
			lead_wave
		};

		voice_out *= amp;
		audio_buffer[i] = voice_out.sum() + solo_wave;
	}
	return &audio_buffer;

fn float sample_height(float fx, float fy)
{
	int x0 = (int)math::floor(fx) & MAP_MASK;
	int y0 = (int)math::floor(fy) & MAP_MASK;
	int x1 = (x0 + 1) & MAP_MASK;
	int y1 = (y0 + 1) & MAP_MASK;

	float tx = fx - math::floor(fx);
	float ty = fy - math::floor(fy);

	float h10 = height_map[y0][x1];
	float h01 = height_map[y1][x0];
	float h11 = height_map[y1][x1];

{

					+ math::sin(fx + fy) * 26.0f + math::sin(fx * 3.0f + fy * 2.0f) * 12.0f + 100.0f;

	float ahead_x = cam_x + math::cos(cam_angle) * 22.0f;
	float ahead_y = cam_y + math::sin(cam_angle) * 22.0f;
	float ahead_h = sample_height(ahead_x, ahead_y);
	float ground_h = (ahead_h > current_h) ? ahead_h : current_h;

	float target_h = ground_h + (ground_h < 52 ? 22 : 36);
	cam_height += (target_h - cam_height) * ((target_h > cam_height) ? 0.15f : 0.03f);
	if (cam_height < current_h + 12) cam_height = current_h + 12;

	cam_pitch += ((target_h - cam_height) * 0.4f - cam_pitch) * 0.1f;
	float current_horizon = 175 + cam_pitch;

	// Sky Gradient
	for (int y = 0; y < height; y++) {
		float t = y / current_horizon;
		Rgba sky_color;
		if (t < 1.0f) {
			sky_color = {
				.x = (char)(12 + t * 110),
				.y = (char)(6 + t * 20),
				.z = (char)(40 + t * 110),
				.w = 255
			};
		} else {
			sky_color = {
				.x = (char)math::clamp(122 - (t - 1) * 180, 0, 255),
				.y = (char)math::clamp(26 - (t - 1) * 60, 0, 255),
				.z = (char)math::clamp(150 - (t - 1) * 200, 0, 255),
				.w = 255
			};
		}
		for (int x = 0; x < width; x++) {
			pixels[y * width + x] = sky_color;
		}
	}

	// Stars
	float fw = width;
	for (int i = 0; i < NUM_STARS; i++) {
		float sx = stars[i].x - cam_angle * 300.0f;
		while (sx < -fw) sx += fw * 2.0f;
		while (sx > fw * 2.0f) sx -= fw * 2.0f;

		int px = (int)(sx * 0.5f + fw * 0.5f);
		int py = (int)(stars[i].y + cam_pitch * 0.4f);
		if (px >= 0 && px < width && py >= 0 && py < current_horizon - 10) {
			char b = (char)(180.0f * stars[i].z + math::sin(frame_count * 0.1f + i) * 60.0f);
			pixels[py * width + px] = { b, b, (char)(b * 0.9f), 255 };
		}
	}

	// Moon
	int moon_cx = width / 2 - (int)(math::sin(cam_angle) * 160.0f);
	int moon_cy = 110 + (int)(cam_pitch * 0.8f);
	int moon_r = 44;
	int max_r = 66;

	for (int dy = -max_r; dy <= max_r; dy++) {
		int py = moon_cy + dy;
		if (py < 0 || py >= current_horizon) continue;

		for (int dx = -max_r; dx <= max_r; dx++) {
			int px = moon_cx + dx;
			if (px < 0 || px >= width) continue;
			int d2 = dx * dx + dy * dy;

			if (d2 > moon_r * moon_r) {
				if (d2 <= max_r * max_r) {
					float gt = 1.0f - (math::sqrt((float)d2) - moon_r) / 22.0f;
					if (gt > 0.0f) {
						gt *= gt;
						Rgba bg = pixels[py * width + px];
						pixels[py * width + px] = {
							(char)math::clamp((bg.x & 255) + gt * 60, 0, 255),
							(char)math::clamp((bg.y & 255) + gt * 160, 0, 255),
							(char)math::clamp((bg.z & 255) + gt * 220, 0, 255),
							255
						};
					}
				}
				continue;
			}

			float nx = dx / 44.0f;
			float ny = dy / 44.0f;
			float nz = math::sqrt(math::clamp(1.0f - nx * nx - ny * ny, 0.0f, 1.0f));
			float light = math::clamp(nz * 0.75f - nx * 0.3f - ny * 0.35f + 0.25f, 0.25f, 1.0f);

			float crater = math::sin(nx * 7.0f) * math::cos(ny * 7.0f) * 0.12f;
			float intensity = math::clamp(light + crater, 0.2f, 1.0f);

			pixels[py * width + px] = {
				(char)math::clamp(140 * intensity + 60, 0, 255),
				(char)math::clamp(200 * intensity + 45, 0, 255),
				(char)math::clamp(235 * intensity + 20, 0, 255),
				255
			};
		}
	}

	// VoxelSpace Terrain Raycaster
	float dz = 0.35f;
	for (int x = 0; x < width; x++) {
		float h_line = current_horizon + (x - width * 0.5f) * math::tan(cam_roll);
		float ray_angle = cam_angle + (x - width * 0.5f) / width;
		float ray_cos = math::cos(ray_angle);
		float ray_sin = math::sin(ray_angle);

		int max_y = height;
		dz = 0.35f;

		for (float z = 1.0f; z < 400.0f; z += dz, dz += 0.005f) {
			int map_x = (int)math::floor(cam_x + ray_cos * z) & MAP_MASK;
			int map_y = (int)math::floor(cam_y + ray_sin * z) & MAP_MASK;

			float h = height_map[map_y][map_x];
			Rgba col = color_map[map_y][map_x];

			if (h < 52) {
				float wave = math::sin(map_x * 0.18f + frame_count * 0.08f) + math::cos(map_y * 0.18f - frame_count * 0.06f);
				float spec = math::clamp(1.0f - math::abs(x - moon_cx) / 160.0f, 0.0f, 1.0f) * (0.6f + wave * 0.2f);
				col = {
					(char)(20 + spec * 235),
					(char)(15 + spec * 180 + wave * 25),
					(char)(80 + spec * 100 + wave * 40),
					255
				};
			} else {
				float slope = (h - height_map[map_y][(map_x + 1) & MAP_MASK])
							+ (h - height_map[(map_y + 1) & MAP_MASK][map_x]);
				float light = math::clamp(1.0f + slope * 0.02f, 0.2f, 1.8f);
				col.x = (char)math::clamp(col.x * light, 0, 255);
				col.y = (char)math::clamp(col.y * light, 0, 255);
				col.z = (char)math::clamp(col.z * light, 0, 255);
			}

			if (z > 260.0f) {
				float f = math::clamp((z - 260.0f) / 140.0f * 2.8f, 0.0f, 1.0f);
				col.x = (char)(col.x * (1 - f) + 122 * f);
				col.y = (char)(col.y * (1 - f) + 26 * f);
				col.z = (char)(col.z * (1 - f) + 150 * f);
			}

			int sy = math::clamp((int)((cam_height - h) / z * 190.0f + h_line), 0, height);
			if (sy < max_y) {
				for (int y = sy; y < max_y; y++) {
					pixels[y * width + x] = col;
				}
				max_y = sy;
			}
			if (max_y <= 0) break;
		}
	}

	// Oscilloscope
	for (int sx = 0; sx < 120; sx++) {
		int sy = 35 + (int)(audio_buffer[(sx * BUFFER_SIZE) / 120] * 22.0f);
		if (sy >= 10 && sy < 80 && (width - 140 + sx) < width) {
			pixels[sy * width + (width - 140 + sx)] = { 0, 255, 230, 255 };
		}
	}

	// Vignette Border
	for (int y = 0; y < height; y += 4) {
		float dy = (y - height * 0.5f) / (height * 0.5f);
		for (int x = 0; x < width; x += 4) {
			float dist_sq = ((x - width * 0.5f) / (width * 0.5f)) * ((x - width * 0.5f) / (width * 0.5f)) + dy * dy;
			if (dist_sq > 0.65f) {
				float vig = math::clamp(1.0f - (dist_sq - 0.65f) * 0.9f, 0.3f, 1.0f);
				for (int vy = 0; vy < 4 && (y + vy) < height; vy++) {
					for (int vx = 0; vx < 4 && (x + vx) < width; vx++) {
						int idx = (y + vy) * width + (x + vx);
						pixels[idx].x = (char)(pixels[idx].x * vig);
						pixels[idx].y = (char)(pixels[idx].y * vig);
						pixels[idx].z = (char)(pixels[idx].z * vig);
					}
				}
			}
		}
	}

	return pixels;
}

fn float* update_audio(int samples) @export("update_audio")
{
	for (int i = 0; i < samples; i++) {
		if (sample_count % STEP_SAMPLES == 0) {
			int sub = step % 16;
			if (sub % 4 == 0) { amp.x = 0.98f; phase.x = 0.0f; }
			if (sub == 4 || sub == 12) { amp.y = 0.5f; phase.y = 0.0f; }
			else if (sub % 2 == 1) { amp.y = 0.15f; phase.y = 0.0f; }
			amp.z = 0.3f;
			if (sub % 2 == 0) { amp.w = 0.20f; phase.w = 0.0f; }
			step++;
		}
		sample_count++;
		kick_pulse = amp.x;
		amp *= { 0.9991f, 0.9980f, 0.9995f, 0.9990f };

		int chord = (step / 16) % 4;
		float[<4>] inc = {
			180.0f * (amp.x * amp.x) + 40.0f,
			350.0f,
			BASS_ROOTS[(step / 16) % 8],
			CHORD_ARPS[chord][(step * 3) % 8]
		};
		phase += inc / SAMPLE_RATE;
		phase -= math::floor(phase);

		bass_phase_2 += (BASS_ROOTS[(step / 16) % 8] * 1.006f) / SAMPLE_RATE;
		if (bass_phase_2 > 1.0f) bass_phase_2 -= 1.0f;

		lead_delay_buffer = lead_delay_buffer * 0.65f + (phase.w < 0.5f ? 0.75f : -0.75f) * (1.0f - amp.x * 0.65f) * 0.35f;

		float[<4>] voice_out = {
			math::sin(phase.x * (float)math::TWO_PI),
			((float)rnd() * 2.0f - 1.0f) * 0.85f + math::sin(phase.y * (float)math::TWO_PI) * 0.15f,
			((phase.z * 2.0f - 1.0f) + (bass_phase_2 * 2.0f - 1.0f)) * 0.5f,
			(phase.w < 0.5f ? 0.75f : -0.75f) * (1.0f - amp.x * 0.65f) + lead_delay_buffer * 0.4f
		};

		audio_buffer[i] = (voice_out * amp).sum();
	}
	return &audio_buffer;
}

fn int main()
{
	io::printn("Engine Active.");
	return 0;
}
</script>

	<script type="text/c3" data-name="Interactive Canvas & Input">module main;
import std;

alias Rgba = char[<4>];

enum EventKind : char {
	NONE,
	MOUSE_MOVE,
	MOUSE_DOWN,
	MOUSE_UP,
	KEY_DOWN,
	KEY_UP,
	WHEEL
}

struct Event {
	EventKind kind;
	Vec2 mouse_pos;
	float wheel;
	int mouse_button;
	int key;
}

struct Particle {
	Vec2 pos;
	Vec2 vel;
	float life;
	Rgba color;
}

const int MAX_PARTICLES = 256;
Particle[MAX_PARTICLES] particles;
int particle_count = 0;

Vec2 player_pos = { 320.0f, 240.0f };
Vec2 player_vel = { 0.0f, 0.0f };
Vec2 mouse_pos = { 320.0f, 240.0f };
bool is_mouse_down = false;

fn void spawn_particle(Vec2 pos) {
	if (particle_count >= MAX_PARTICLES) return;
	float angle = (float)rnd() * (float)math::TWO_PI;
	float speed = 40.0f + (float)rnd() * 160.0f;
	particles[particle_count++] = {
		.pos = pos,
		.vel = { math::cos(angle) * speed, math::sin(angle) * speed },
		.life = 1.0f,
		.color = { (char)(100 + rnd() * 155), (char)(150 + rnd() * 105), 255, 255 }
	};
}

fn Rgba* update_canvas(int width, int height, float dt, Event[] events) @export("update_canvas")
{
	static Rgba[] pixels;
	if (pixels.len < width * height) pixels = mem::new_array(Rgba, width * height);

	foreach (event : events)
	{
		switch (event.kind)
		{
			case MOUSE_MOVE:
				mouse_pos = event.mouse_pos;
				if (is_mouse_down) spawn_particle(mouse_pos);

			case MOUSE_DOWN:
				is_mouse_down = true;
				mouse_pos = event.mouse_pos;
				for (int i = 0; i < 16; i++) spawn_particle(mouse_pos);

			case MOUSE_UP:
				is_mouse_down = false;

			case WHEEL:
				mouse_pos = event.mouse_pos;
				for (int i = 0; i < 8; i++) spawn_particle(mouse_pos);

			case KEY_DOWN:
				if (event.key == 'w' || event.key == 'W' || event.key == 38) player_vel.y = -200.0f;
				if (event.key == 's' || event.key == 'S' || event.key == 40) player_vel.y = 200.0f;
				if (event.key == 'a' || event.key == 'A' || event.key == 37) player_vel.x = -200.0f;
				if (event.key == 'd' || event.key == 'D' || event.key == 39) player_vel.x = 200.0f;
				if (event.key == 32) { // Spacebar
					for (int i = 0; i < 32; i++) spawn_particle(player_pos);
				}

			case KEY_UP:
				if (event.key == 'w' || event.key == 'W' || event.key == 38 || event.key == 's' || event.key == 'S' || event.key == 40) player_vel.y = 0.0f;
				if (event.key == 'a' || event.key == 'A' || event.key == 37 || event.key == 'd' || event.key == 'D' || event.key == 39) player_vel.x = 0.0f;

			default: break;
		}
	}

	player_pos += player_vel * dt;
	player_pos.x = math::clamp(player_pos.x, 10.0f, (float)width - 10.0f);
	player_pos.y = math::clamp(player_pos.y, 10.0f, (float)height - 10.0f);

	pixels[..] = (Rgba){ 15, 23, 42, 255 };

	int active_idx = 0;
	for (int i = 0; i < particle_count; i++) {
		particles[i].pos += particles[i].vel * dt;
		particles[i].life -= 1.2f * dt;

		if (particles[i].life > 0.0f) {
			int px = (int)particles[i].pos.x;
			int py = (int)particles[i].pos.y;
			if (px >= 0 && px < width && py >= 0 && py < height) {
				Rgba col = particles[i].color;
				col.w = (char)(particles[i].life * 255.0f);
				pixels[py * width + px] = col;
			}
			particles[active_idx++] = particles[i];
		}
	}
	particle_count = active_idx;

	int px = (int)player_pos.x;
	int py = (int)player_pos.y;
	for (int dy = -8; dy <= 8; dy++) {
		for (int dx = -8; dx <= 8; dx++) {
			int ix = px + dx;
			int iy = py + dy;
			if (ix >= 0 && ix < width && iy >= 0 && iy < height) {
				pixels[iy * width + ix] = { 56, 189, 248, 255 };
			}
		}
	}

	int mx = (int)mouse_pos.x;
	int my = (int)mouse_pos.y;
	Rgba cursor_col = is_mouse_down ? (Rgba){ 244, 63, 94, 255 } : (Rgba){ 250, 204, 21, 255 };
	for (int dy = -4; dy <= 4; dy++) {
		for (int dx = -4; dx <= 4; dx++) {
			if (dx * dx + dy * dy <= 16) {
				int ix = mx + dx;
				int iy = my + dy;
				if (ix >= 0 && ix < width && iy >= 0 && iy < height) {
					pixels[iy * width + ix] = cursor_col;
				}
			}
		}
	}

	return pixels;
}

fn int main()
{
	io::printn("Interactive Canvas Engine Active!");
	io::printn("Controls: Move with WASD or Arrow Keys.");
	io::printn("Click/Drag mouse to spawn particles! Scroll wheel or Spacebar explodes particles.");
	return 0;
}
</script>

	<script type="text/c3" data-name="NEON OVERDRIVE: CYBER ARENA">module main;
import std;

alias Vec2 = float[<2>];
alias Rgba = char[<4>];

struct Rect {
	int x;
	int y;
	int w;
	int h;
}

enum EventKind : char {
	NONE,
	MOUSE_MOVE,
	MOUSE_DOWN,
	MOUSE_UP,
	KEY_DOWN,
	KEY_UP,
	WHEEL
}

struct Event {
	EventKind kind;
	Vec2 mouse_pos;
	float wheel;
	int mouse_button;
	int key;
}

const int KEY_UP = 38;
const int KEY_DOWN = 40;
const int KEY_LEFT = 37;
const int KEY_RIGHT = 39;
const int KEY_SPACE = 32;

// --- Canvas Object & Type Methods ---
struct Canvas {
	Rgba[] pixels;
	int width;
	int height;
}

fn void Canvas.clear(&self, Rgba col) {
	self.pixels[..] = col;
}

fn void Canvas.draw_pixel(&self, int x, int y, Rgba col) {
	if (x >= 0 && x < self.width && y >= 0 && y < self.height) {
		self.pixels[y * self.width + x] = col;
	}
}

fn void Canvas.draw_rect(&self, Rect r, Rgba col) {
	int min_x = math::clamp(r.x, 0, self.width);
	int max_x = math::clamp(r.x + r.w, 0, self.width);
	int min_y = math::clamp(r.y, 0, self.height);
	int max_y = math::clamp(r.y + r.h, 0, self.height);

	for (int y = min_y; y < max_y; y++) {
		for (int x = min_x; x < max_x; x++) {
			self.pixels[y * self.width + x] = col;
		}
	}
}

fn void Canvas.draw_circle(&self, Vec2 center, float r, Rgba col) {
	int min_x = math::clamp((int)(center.x - r), 0, self.width);
	int max_x = math::clamp((int)(center.x + r + 1.0f), 0, self.width);
	int min_y = math::clamp((int)(center.y - r), 0, self.height);
	int max_y = math::clamp((int)(center.y + r + 1.0f), 0, self.height);

	float r_sq = r * r;
	for (int y = min_y; y < max_y; y++) {
		for (int x = min_x; x < max_x; x++) {
			Vec2 p = { (float)x, (float)y };
			Vec2 diff = p - center;
			if (diff.x * diff.x + diff.y * diff.y <= r_sq) {
				self.pixels[y * self.width + x] = col;
			}
		}
	}
}

fn void Canvas.draw_line(&self, Vec2 start, Vec2 end, Rgba col) {
	int x0 = (int)start.x;
	int y0 = (int)start.y;
	int x1 = (int)end.x;
	int y1 = (int)end.y;

	int dx = math::abs(x1 - x0);
	int sx = x0 < x1 ? 1 : -1;
	int dy = -math::abs(y1 - y0);
	int sy = y0 < y1 ? 1 : -1;
	int err = dx + dy;

	while (true) {
		self.draw_pixel(x0, y0, col);
		if (x0 == x1 && y0 == y1) break;
		int e2 = 2 * err;
		if (e2 >= dy) { err += dy; x0 += sx; }
		if (e2 <= dx) { err += dx; y0 += sy; }
	}
}

fn void Canvas.draw_line_dashed(&self, Vec2 start, Vec2 end, Rgba col, int dash_len) {
	int x0 = (int)start.x;
	int y0 = (int)start.y;
	int x1 = (int)end.x;
	int y1 = (int)end.y;

	int dx = math::abs(x1 - x0);
	int sx = x0 < x1 ? 1 : -1;
	int dy = -math::abs(y1 - y0);
	int sy = y0 < y1 ? 1 : -1;
	int err = dx + dy;
	int step_count = 0;

	while (true) {
		if ((step_count / dash_len) % 2 == 0) {
			self.draw_pixel(x0, y0, col);
		}
		step_count++;
		if (x0 == x1 && y0 == y1) break;
		int e2 = 2 * err;
		if (e2 >= dy) { err += dy; x0 += sx; }
		if (e2 <= dx) { err += dx; y0 += sy; }
	}
}

fn void Canvas.draw_grid(&self, Vec2 offset, int size, Rgba col) {
	int off_x = (int)offset.x % size;
	int off_y = (int)offset.y % size;

	for (int x = off_x; x < self.width; x += size) {
		self.draw_line((Vec2){ (float)x, 0.0f }, (Vec2){ (float)x, (float)self.height }, col);
	}
	for (int y = off_y; y < self.height; y += size) {
		self.draw_line((Vec2){ 0.0f, (float)y }, (Vec2){ (float)self.width, (float)y }, col);
	}
}

// 3x5 Pixel Font Bitmap Map
fn ushort get_char_bitmap(char c) {
	char uppercase = c;
	if (c >= 'a' && c <= 'z') uppercase -= 32;

	switch (uppercase) {
		case 'A': return 0b010_101_111_101_101;
		case 'B': return 0b110_101_110_101_110;
		case 'C': return 0b011_100_100_100_011;
		case 'D': return 0b110_101_101_101_110;
		case 'E': return 0b111_100_110_100_111;
		case 'F': return 0b111_100_110_100_100;
		case 'G': return 0b011_100_101_101_011;
		case 'H': return 0b101_101_111_101_101;
		case 'I': return 0b111_010_010_010_111;
		case 'J': return 0b001_001_001_101_010;
		case 'K': return 0b101_101_110_101_101;
		case 'L': return 0b100_100_100_100_111;
		case 'M': return 0b101_111_101_101_101;
		case 'N': return 0b111_101_101_101_101;
		case 'O': return 0b010_101_101_101_010;
		case 'P': return 0b110_101_110_100_100;
		case 'Q': return 0b010_101_101_110_011;
		case 'R': return 0b110_101_110_101_101;
		case 'S': return 0b011_100_010_001_110;
		case 'T': return 0b111_010_010_010_010;
		case 'U': return 0b101_101_101_101_011;
		case 'V': return 0b101_101_101_101_010;
		case 'W': return 0b101_101_101_111_101;
		case 'X': return 0b101_101_010_101_101;
		case 'Y': return 0b101_101_010_010_010;
		case 'Z': return 0b111_001_010_100_111;
		case '0': return 0b010_101_101_101_010;
		case '1': return 0b010_110_010_010_111;
		case '2': return 0b111_001_111_100_111;
		case '3': return 0b111_001_011_001_111;
		case '4': return 0b101_101_111_001_001;
		case '5': return 0b111_100_111_001_111;
		case '6': return 0b011_100_111_101_011;
		case '7': return 0b111_001_010_100_100;
		case '8': return 0b010_101_010_101_010;
		case '9': return 0b011_101_011_001_110;
		case ':': return 0b000_010_000_010_000;
		case '!': return 0b010_010_010_000_010;
		case '-': return 0b000_000_111_000_000;
		case ' ': return 0b000_000_000_000_000;
		default:  return 0b000_000_000_000_000;
	}
}

fn void Canvas.draw_text(&self, int x, int y, String str, int scale, Rgba col) {
	int cur_x = x;
	foreach (c : str) {
		ushort bits = get_char_bitmap(c);
		for (int row = 0; row < 5; row++) {
			for (int col_idx = 0; col_idx < 3; col_idx++) {
				int bit_pos = 14 - (row * 3 + col_idx);
				if ((bits & (1 << bit_pos)) != 0) {
					self.draw_rect((Rect){ cur_x + col_idx * scale, y + row * scale, scale, scale }, col);
				}
			}
		}
		cur_x += 4 * scale;
	}
}

fn void Canvas.draw_number(&self, int x, int y, int num, int scale, Rgba col) {
	if (num == 0) {
		self.draw_text(x, y, "0", scale, col);
		return;
	}
	int temp = num;
	int digits_count = 0;
	char[10] d;
	while (temp > 0 && digits_count < 10) {
		d[digits_count++] = (char)('0' + (temp % 10));
		temp /= 10;
	}
	int offset_x = x;
	for (int i = digits_count - 1; i >= 0; i--) {
		char[1] s = { d[i] };
		self.draw_text(offset_x, y, (String)s[..], scale, col);
		offset_x += 4 * scale;
	}
}

// --- Game Constants & State ---
enum GameState {
	START,
	PLAYING,
	GAMEOVER
}

GameState game_state = START;

struct Player {
	Vec2 pos;
	Vec2 vel;
	float angle;
	float hp;
	float max_hp;
	int weapon;
	float shoot_cooldown;
}

struct Bullet {
	bool active;
	Vec2 pos;
	Vec2 vel;
	float radius;
	float life;
	Rgba color;
	bool is_enemy;
	float damage;
}

struct Enemy {
	bool active;
	Vec2 pos;
	Vec2 vel;
	float hp;
	float max_hp;
	int type; // 0: Chaser, 1: Swarmer, 2: Brute
	float size;
	float shoot_cooldown;
	float anim_timer;
}

struct Particle {
	bool active;
	Vec2 pos;
	Vec2 vel;
	float life;
	float max_life;
	float size;
	Rgba color;
}

const int MAX_BULLETS = 128;
const int MAX_ENEMIES = 48;
const int MAX_PARTICLES = 256;

Player player;
Bullet[MAX_BULLETS] bullets;
Enemy[MAX_ENEMIES] enemies;
Particle[MAX_PARTICLES] particles;

int score = 0;
int wave = 1;
int enemies_left_in_wave = 0;
float wave_spawn_timer = 0.0f;
float screen_shake = 0.0f;
int frame_count = 0;

Vec2 mouse_pos = { 320.0f, 240.0f };
bool mouse_down = false;
bool[256] keys_down;

// Audio SFX Timers
float sfx_laser = 0.0f;
float sfx_explosion = 0.0f;

// --- Particle System ---
fn void spawn_particle(Vec2 pos, Vec2 vel, float life, float size, Rgba color) {
	for (int i = 0; i < MAX_PARTICLES; i++) {
		if (!particles[i].active) {
			particles[i] = {
				.active = true,
				.pos = pos,
				.vel = vel,
				.life = life,
				.max_life = life,
				.size = size,
				.color = color
			};
			break;
		}
	}
}

fn void create_explosion(Vec2 pos, Rgba color, int count) {
	sfx_explosion = 0.35f;
	screen_shake = math::clamp(screen_shake + (float)count * 0.15f, 0.0f, 12.0f);
	for (int i = 0; i < count; i++) {
		float angle = (float)rnd() * (float)math::TWO_PI;
		float speed = 30.0f + (float)rnd() * 220.0f;
		Vec2 vel = { math::cos(angle) * speed, math::sin(angle) * speed };
		spawn_particle(pos, vel, 0.2f + (float)rnd() * 0.5f, 2.0f + (float)rnd() * 3.0f, color);
	}
}

// --- Game Reset & Spawning ---
fn void reset_game() {
	player = {
		.pos = { 320.0f, 240.0f },
		.vel = { 0.0f, 0.0f },
		.angle = 0.0f,
		.hp = 100.0f,
		.max_hp = 100.0f,
		.weapon = 0,
		.shoot_cooldown = 0.0f
	};

	for (sz i = 0; i < bullets.len; i++) bullets[i].active = false;
	for (sz i = 0; i < enemies.len; i++) enemies[i].active = false;
	for (sz i = 0; i < particles.len; i++) particles[i].active = false;

	keys_down[..] = false;
	mouse_down = false;

	score = 0;
	wave = 1;
	enemies_left_in_wave = 6;
	wave_spawn_timer = 0.0f;
	game_state = PLAYING;
}

fn void spawn_enemy() {
	int type = 0;
	float roll = (float)rnd();
	if (wave >= 2 && roll > 0.6f) type = 1;
	if (wave >= 3 && roll > 0.85f) type = 2;

	Vec2 pos;
	if (rnd() < 0.5f) {
		pos.x = rnd() < 0.5f ? -20.0f : 660.0f;
		pos.y = (float)rnd() * 480.0f;
	} else {
		pos.x = (float)rnd() * 640.0f;
		pos.y = rnd() < 0.5f ? -20.0f : 500.0f;
	}

	float hp = type == 2 ? 60.0f : (type == 1 ? 15.0f : 25.0f);
	float size = type == 2 ? 14.0f : (type == 1 ? 7.0f : 9.0f);
	float wave_bonus = (float)wave * 3.0f;

	for (int i = 0; i < MAX_ENEMIES; i++) {
		if (!enemies[i].active) {
			enemies[i] = {
				.active = true,
				.pos = pos,
				.vel = { 0.0f, 0.0f },
				.hp = hp + wave_bonus,
				.max_hp = hp + wave_bonus,
				.type = type,
				.size = size,
				.shoot_cooldown = (float)rnd() * 2.0f,
				.anim_timer = (float)rnd() * 10.0f
			};
			break;
		}
	}
}

// --- Player Shooting Logic ---
fn void fire_weapon() {
	if (player.shoot_cooldown > 0.0f) return;

	Vec2 dir = mouse_pos - player.pos;
	float len = dir.length();
	if (len < 0.001f) return;
	dir /= len;

	sfx_laser = 0.12f;

	switch (player.weapon) {
		case 0: // Pulse Blaster
			player.shoot_cooldown = 0.12f;
			for (int i = 0; i < MAX_BULLETS; i++) {
				if (!bullets[i].active) {
					bullets[i] = {
						.active = true,
						.pos = player.pos + dir * 4.0f,
						.vel = dir * 550.0f,
						.radius = 3.0f,
						.life = 1.2f,
						.color = { 56, 189, 248, 255 },
						.is_enemy = false,
						.damage = 18.0f
					};
					break;
				}
			}

		case 1: // Plasma Spread
			player.shoot_cooldown = 0.28f;
			float[3] angles = { -0.22f, 0.0f, 0.22f };
			foreach (spread : angles) {
				float base_a = math::atan2(dir.y, dir.x) + spread;
				Vec2 spread_dir = { math::cos(base_a), math::sin(base_a) };

				for (int i = 0; i < MAX_BULLETS; i++) {
					if (!bullets[i].active) {
						bullets[i] = {
							.active = true,
							.pos = player.pos + spread_dir * 4.0f,
							.vel = spread_dir * 460.0f,
							.radius = 2.5f,
							.life = 1.0f,
							.color = { 244, 63, 94, 255 },
							.is_enemy = false,
							.damage = 14.0f
						};
						break;
					}
				}
			}

		case 2: // Devastator Cannon
			player.shoot_cooldown = 0.55f;
			screen_shake += 2.5f;
			for (int i = 0; i < MAX_BULLETS; i++) {
				if (!bullets[i].active) {
					bullets[i] = {
						.active = true,
						.pos = player.pos + dir * 4.0f,
						.vel = dir * 320.0f,
						.radius = 7.0f,
						.life = 1.8f,
						.color = { 250, 204, 21, 255 },
						.is_enemy = false,
						.damage = 65.0f
					};
					break;
				}
			}
	}
}

// --- Exported Canvas Renderer ---
fn Rgba* update_canvas(int width, int height, float dt, Event[] events) @export("update_canvas")
{
	static Rgba[] pixels;
	if (pixels.len < width * height) pixels = mem::new_array(Rgba, width * height);

	Canvas canvas = { .pixels = pixels, .width = width, .height = height };
	Vec2 move_input = { 0.0f, 0.0f };

	// Event Processing
	foreach (event : events) {
		switch (event.kind) {
			case MOUSE_MOVE:
				mouse_pos = event.mouse_pos;

			case MOUSE_DOWN:
				mouse_pos = event.mouse_pos;
				if (event.mouse_button == 0) mouse_down = true;
				if (game_state == START || game_state == GAMEOVER) reset_game();

			case MOUSE_UP:
				if (event.mouse_button == 0) mouse_down = false;

			case WHEEL:
				if (game_state == PLAYING) {
					if (event.wheel > 0) {
						player.weapon = (player.weapon + 1) % 3;
					} else if (event.wheel < 0) {
						player.weapon = (player.weapon + 2) % 3;
					}
				}

			case KEY_DOWN:
				int k = event.key;
				if (k >= 'A' && k <= 'Z') k += 32;
				if (k < 256) keys_down[k] = true;

				if (game_state == PLAYING) {
					if (k == '1') player.weapon = 0;
					if (k == '2') player.weapon = 1;
					if (k == '3') player.weapon = 2;
				}
				if (k == KEY_SPACE) {
					if (game_state == START || game_state == GAMEOVER) reset_game();
				}

			case KEY_UP:
				int k_up = event.key;
				if (k_up >= 'A' && k_up <= 'Z') k_up += 32;
				if (k_up < 256) keys_down[k_up] = false;

			default: break;
		}
	}

	// Update Timers & Shake
	sfx_laser = math::clamp(sfx_laser - dt, 0.0f, 1.0f);
	sfx_explosion = math::clamp(sfx_explosion - dt, 0.0f, 1.0f);
	screen_shake = math::clamp(screen_shake - dt * 10.0f, 0.0f, 20.0f);

	Vec2 shake_offset = { 0.0f, 0.0f };
	if (screen_shake > 0.05f) {
		shake_offset = {
			((float)rnd() - 0.5f) * screen_shake,
			((float)rnd() - 0.5f) * screen_shake
		};
	}

	// --- Gameplay Updates ---
	if (game_state == PLAYING) {
		// Player movement vector
		if (keys_down['w'] || keys_down[KEY_UP]) move_input.y -= 1.0f;
		if (keys_down['s'] || keys_down[KEY_DOWN]) move_input.y += 1.0f;
		if (keys_down['a'] || keys_down[KEY_LEFT]) move_input.x -= 1.0f;
		if (keys_down['d'] || keys_down[KEY_RIGHT]) move_input.x += 1.0f;

		if (move_input.length() > 0.001f) {
			move_input = move_input.normalize();
			player.vel += move_input * 1400.0f * dt;
		}

		player.vel *= 0.88f; // Friction
		player.pos += player.vel * dt;
		player.pos.x = math::clamp(player.pos.x, 12.0f, (float)width - 12.0f);
		player.pos.y = math::clamp(player.pos.y, 12.0f, (float)height - 12.0f);

		// Player Aim Angle
		Vec2 aim_dir = mouse_pos - player.pos;
		player.angle = math::atan2(aim_dir.y, aim_dir.x);

		// Shooting
		if (player.shoot_cooldown > 0.0f) player.shoot_cooldown -= dt;
		if (mouse_down) fire_weapon();

		// Wave Spawner
		if (enemies_left_in_wave > 0) {
			wave_spawn_timer -= dt;
			if (wave_spawn_timer <= 0.0f) {
				spawn_enemy();
				enemies_left_in_wave--;
				wave_spawn_timer = 0.4f + (float)rnd() * 0.6f;
			}
		} else {
			bool active_found = false;
			foreach (e : enemies) {
				if (e.active) { active_found = true; break; }
			}
			if (!active_found) {
				wave++;
				enemies_left_in_wave = 6 + wave * 4;
				player.hp = math::clamp(player.hp + 25.0f, 0.0f, player.max_hp);
			}
		}

		// Enemy Logic
		for (int i = 0; i < MAX_ENEMIES; i++) {
			if (!enemies[i].active) continue;
			enemies[i].anim_timer += dt * 3.0f;

			Vec2 to_player = player.pos - enemies[i].pos;
			float dist = to_player.length();
			Vec2 dir = dist > 0.001f ? to_player / dist : (Vec2){ 0.0f, 0.0f };

			switch (enemies[i].type) {
				case 0: // Chaser
					enemies[i].pos += dir * (110.0f + (float)wave * 5.0f) * dt;

				case 1: // Swarmer
					Vec2 perp = { -dir.y, dir.x };
					Vec2 swarmer_dir = dir + perp * math::sin(enemies[i].anim_timer) * 0.8f;
					enemies[i].pos += swarmer_dir.normalize() * (160.0f + (float)wave * 6.0f) * dt;

				case 2: // Brute
					if (dist > 140.0f) enemies[i].pos += dir * 65.0f * dt;
					enemies[i].shoot_cooldown -= dt;
					if (enemies[i].shoot_cooldown <= 0.0f) {
						enemies[i].shoot_cooldown = 1.8f;
						for (int b = 0; b < MAX_BULLETS; b++) {
							if (!bullets[b].active) {
								bullets[b] = {
									.active = true,
									.pos = enemies[i].pos,
									.vel = dir * 210.0f,
									.radius = 4.0f,
									.life = 3.0f,
									.color = { 245, 158, 11, 255 },
									.is_enemy = true,
									.damage = 15.0f
								};
								break;
							}
						}
					}
			}

			// Enemy vs Player collision & exact smooth radius separation
			float min_dist = enemies[i].size + 8.0f;
			if (dist < min_dist) {
				player.hp -= 20.0f * dt;
				screen_shake += 0.8f;

				float overlap = min_dist - dist;
				if (dist > 0.001f) {
					enemies[i].pos -= dir * overlap;
				} else {
					enemies[i].pos.x += min_dist;
				}

				if (player.hp <= 0.0f) {
					create_explosion(player.pos, { 56, 189, 248, 255 }, 40);
					game_state = GAMEOVER;
				}
			}

			// Enemy vs Enemy crowding separation
			for (int j = i + 1; j < MAX_ENEMIES; j++) {
				if (!enemies[j].active) continue;
				Vec2 sep_d = enemies[j].pos - enemies[i].pos;
				float sep_dist = sep_d.length();
				float min_sep = enemies[i].size + enemies[j].size;
				if (sep_dist < min_sep && sep_dist > 0.001f) {
					Vec2 sep_dir = sep_d / sep_dist;
					float sep_overlap = (min_sep - sep_dist) * 0.5f;
					enemies[i].pos -= sep_dir * sep_overlap;
					enemies[j].pos += sep_dir * sep_overlap;
				}
			}
		}

		// Bullet Updates & Collision
		for (int i = 0; i < MAX_BULLETS; i++) {
			if (!bullets[i].active) continue;
			bullets[i].pos += bullets[i].vel * dt;
			bullets[i].life -= dt;

			if (bullets[i].life <= 0.0f || bullets[i].pos.x < 0.0f || bullets[i].pos.x > (float)width ||
				bullets[i].pos.y < 0.0f || bullets[i].pos.y > (float)height) {
				bullets[i].active = false;
				continue;
			}

			// Bullet trails
			if (rnd() < 0.4f) {
				spawn_particle(bullets[i].pos, { 0.0f, 0.0f }, 0.1f, bullets[i].radius * 0.7f, bullets[i].color);
			}

			if (bullets[i].is_enemy) {
				// Enemy Bullet vs Player
				if ((bullets[i].pos - player.pos).length() < (bullets[i].radius + 8.0f)) {
					bullets[i].active = false;
					player.hp -= bullets[i].damage;
					screen_shake += 2.0f;
					create_explosion(bullets[i].pos, { 245, 158, 11, 255 }, 8);
					if (player.hp <= 0.0f) game_state = GAMEOVER;
				}
			} else {
				// Player Bullet vs Enemy
				for (int e = 0; e < MAX_ENEMIES; e++) {
					if (!enemies[e].active) continue;
					if ((bullets[i].pos - enemies[e].pos).length() < (bullets[i].radius + enemies[e].size)) {
						enemies[e].hp -= bullets[i].damage;
						bullets[i].active = false;

						// Hit spark
						spawn_particle(bullets[i].pos, bullets[i].vel * -0.2f, 0.15f, 3.0f, { 255, 255, 255, 255 });

						if (enemies[e].hp <= 0.0f) {
							enemies[e].active = false;
							score += (enemies[e].type + 1) * 100;
							Rgba exp_col = enemies[e].type == 2 ? (Rgba){ 245, 158, 11, 255 } :
								(enemies[e].type == 1 ? (Rgba){ 168, 85, 247, 255 } : (Rgba){ 239, 68, 68, 255 });
							create_explosion(enemies[e].pos, exp_col, 16 + enemies[e].type * 8);
						}
						break;
					}
				}
			}
		}

		// Particles
		for (int i = 0; i < MAX_PARTICLES; i++) {
			if (!particles[i].active) continue;
			particles[i].pos += particles[i].vel * dt;
			particles[i].life -= dt;
			if (particles[i].life <= 0.0f) particles[i].active = false;
		}
	}

	// --- RENDER PASS ---
	// Background Clear & Grid
	canvas.clear({ 10, 15, 26, 255 });
	canvas.draw_grid(shake_offset, 40, { 20, 30, 50, 255 });

	if (game_state == PLAYING) {
		// Particles
		foreach (p : particles) {
			if (!p.active) continue;
			canvas.draw_circle(p.pos + shake_offset, p.size, p.color);
		}

		// Bullets
		foreach (b : bullets) {
			if (!b.active) continue;
			canvas.draw_circle(b.pos + shake_offset, b.radius, b.color);
		}

		// Enemies
		foreach (e : enemies) {
			if (!e.active) continue;
			Vec2 e_pos = e.pos + shake_offset;
			Rgba e_col = e.type == 2 ? (Rgba){ 245, 158, 11, 255 } :
				(e.type == 1 ? (Rgba){ 168, 85, 247, 255 } : (Rgba){ 239, 68, 68, 255 });
			canvas.draw_circle(e_pos, e.size, e_col);

			// HP bar for Brutes
			if (e.type == 2) {
				float hp_ratio = math::clamp(e.hp / e.max_hp, 0.0f, 1.0f);
				canvas.draw_rect((Rect){ (int)e_pos.x - 12, (int)e_pos.y - 18, 24, 3 }, { 50, 50, 50, 255 });
				canvas.draw_rect((Rect){ (int)e_pos.x - 12, (int)e_pos.y - 18, (int)(24.0f * hp_ratio), 3 }, e_col);
			}
		}

		// Player Ship
		Vec2 p_pos = player.pos + shake_offset;
		Vec2 fwd = { math::cos(player.angle), math::sin(player.angle) };
		Vec2 right = { -fwd.y, fwd.x };

		Vec2 p1 = p_pos + fwd * 12.0f;
		Vec2 p2 = p_pos - fwd * 8.0f + right * 7.0f;
		Vec2 p3 = p_pos - fwd * 8.0f - right * 7.0f;

		// Short static thruster fixed directly behind ship
		float flame_len = 5.0f + (float)rnd() * 3.0f;
		Vec2 flame_tip = p_pos - fwd * (8.0f + flame_len);
		Vec2 flame_l = p_pos - fwd * 8.0f + right * 2.5f;
		Vec2 flame_r = p_pos - fwd * 8.0f - right * 2.5f;
		Rgba flame_col = rnd() < 0.5f ? (Rgba){ 251, 146, 60, 255 } : (Rgba){ 250, 204, 21, 255 };
		canvas.draw_line(flame_l, flame_tip, flame_col);
		canvas.draw_line(flame_r, flame_tip, flame_col);

		// Ship Body
		Rgba p_col = { 56, 189, 248, 255 };
		canvas.draw_line(p1, p2, p_col);
		canvas.draw_line(p2, p3, p_col);
		canvas.draw_line(p3, p1, p_col);

		// Dotted Aim Line
		canvas.draw_line_dashed(p_pos, mouse_pos, { 60, 90, 120, 255 }, 4);
		canvas.draw_circle(mouse_pos, 4.0f, { 250, 204, 21, 255 });

		// --- HUD Overlay ---
		// Health Bar
		canvas.draw_rect((Rect){ 16, 16, 150, 10 }, { 30, 41, 59, 255 });
		float hp_pct = math::clamp(player.hp / player.max_hp, 0.0f, 1.0f);
		Rgba hp_col = hp_pct > 0.5f ? (Rgba){ 52, 211, 153, 255 } : (hp_pct > 0.25f ? (Rgba){ 251, 191, 36, 255 } : (Rgba){ 244, 63, 94, 255 });
		canvas.draw_rect((Rect){ 16, 16, (int)(150.0f * hp_pct), 10 }, hp_col);

		// 3-Slot Weapon Selector HUD [1] [2] [3]
		Rgba[3] weapon_colors = {
			{ 56, 189, 248, 255 },  // Slot 1: Pulse (Cyan)
			{ 244, 63, 94, 255 },   // Slot 2: Spread (Magenta)
			{ 250, 204, 21, 255 }   // Slot 3: Devastator (Yellow)
		};

		for (int slot = 0; slot < 3; slot++) {
			int slot_x = 16 + slot * 22;
			int slot_y = 32;

			if (player.weapon == slot) {
				// Active Weapon: Highlighted White Border + Bright Colored Core
				canvas.draw_rect((Rect){ slot_x - 1, slot_y - 1, 18, 18 }, { 255, 255, 255, 255 });
				canvas.draw_rect((Rect){ slot_x, slot_y, 16, 16 }, weapon_colors[slot]);
			} else {
				// Inactive Weapon: Dark Slot + Small Color Pip
				canvas.draw_rect((Rect){ slot_x, slot_y, 16, 16 }, { 30, 41, 59, 255 });
				canvas.draw_rect((Rect){ slot_x + 3, slot_y + 3, 10, 10 }, weapon_colors[slot]);
			}
		}

		// Score & Wave Text
		canvas.draw_number(width - 110, 16, score, 2, { 248, 250, 252, 255 });
		canvas.draw_number(width / 2 - 10, 16, wave, 3, { 56, 189, 248, 255 });
	}
	else if (game_state == START) {
		// Title Screen
		String title = "NEON OVERDRIVE";
		int title_x = width / 2 - ((int)title.len * 4 * 3) / 2;
		canvas.draw_text(title_x, height / 2 - 45, title, 3, { 56, 189, 248, 255 });

		String subtitle = "CYBER ARENA";
		int sub_x = width / 2 - ((int)subtitle.len * 4 * 2) / 2;
		canvas.draw_text(sub_x, height / 2 - 15, subtitle, 2, { 168, 85, 247, 255 });

		// Pulsing Click prompt
		if ((int)(frame_count * 0.1f) % 2 == 0) {
			String prompt = "CLICK TO START";
			int prompt_x = width / 2 - ((int)prompt.len * 4 * 2) / 2;
			canvas.draw_text(prompt_x, height / 2 + 40, prompt, 2, { 250, 204, 21, 255 });
		}
	}
	else if (game_state == GAMEOVER) {
		// Game Over Screen
		String go_text = "GAME OVER";
		int go_x = width / 2 - ((int)go_text.len * 4 * 4) / 2;
		canvas.draw_text(go_x, height / 2 - 60, go_text, 4, { 244, 63, 94, 255 });

		String score_lbl = "FINAL SCORE";
		int lbl_x = width / 2 - ((int)score_lbl.len * 4 * 2) / 2;
		canvas.draw_text(lbl_x, height / 2, score_lbl, 2, { 148, 163, 184, 255 });

		canvas.draw_number(width / 2 - 20, height / 2 + 20, score, 3, { 248, 250, 252, 255 });

		if ((int)(frame_count * 0.1f) % 2 == 0) {
			String restart_prompt = "CLICK TO RESTART";
			int restart_x = width / 2 - ((int)restart_prompt.len * 4 * 2) / 2;
			canvas.draw_text(restart_x, height / 2 + 65, restart_prompt, 2, { 56, 189, 248, 255 });
		}
	}

	frame_count++;
	return pixels;
}

// --- Dynamic Synthwave Chiptune Audio Engine ---
float bass_phase = 0.0f;
float lead_phase = 0.0f;
int sample_count = 0;

const float[16] BASS_NOTES = {
	110.0f,  110.0f,  110.0f,  110.0f,
	130.81f, 130.81f, 130.81f, 130.81f,
	98.0f,   98.0f,   98.0f,   98.0f,
	87.31f,  87.31f,  87.31f,  87.31f
};

const float[16] LEAD_NOTES = {
	220.0f,  329.63f, 440.0f,  329.63f,
	261.63f, 392.00f, 523.25f, 392.00f,
	196.00f, 293.66f, 392.00f, 293.66f,
	174.61f, 261.63f, 349.23f, 261.63f
};

fn float* update_audio(int samples) @export("update_audio")
{
	static float[1024] audio_buf;
	int step_samples = 5512; // 120 BPM 16th notes

	for (int i = 0; i < samples; i++) {
		float out = 0.0f;

		if (game_state == PLAYING) {
			int step = (sample_count / step_samples) % 16;
			float step_progress = (float)(sample_count % step_samples) / (float)step_samples;
			float env = (1.0f - step_progress) * (1.0f - step_progress); // Exponential note pluck envelope
			sample_count++;

			bass_phase += BASS_NOTES[step] / 44100.0f;
			if (bass_phase > 1.0f) bass_phase -= 1.0f;

			lead_phase += LEAD_NOTES[step] / 44100.0f;
			if (lead_phase > 1.0f) lead_phase -= 1.0f;

			float bass_wave = (bass_phase < 0.4f ? 0.06f : -0.06f) * env;
			float lead_wave = math::sin(lead_phase * (float)math::TWO_PI) * env * 0.04f;

			out += bass_wave + lead_wave;

			// Laser SFX
			if (sfx_laser > 0.0f) {
				float laser_freq = 800.0f * (sfx_laser / 0.12f);
				out += math::sin(sample_count * laser_freq * 0.0001f) * 0.18f;
			}

			// Explosion SFX
			if (sfx_explosion > 0.0f) {
				out += ((float)rnd() * 2.0f - 1.0f) * 0.25f * (sfx_explosion / 0.35f);
			}
		}

		audio_buf[i] = out;
	}
	return &audio_buf;
}

fn float pitch_to_freq(Pitch pitch) {
	return 440.0f * math::pow(2.0f, ((float)pitch - 69.0f) / 12.0f);
}

fn bool pitch_is_black(Pitch pitch) {
	int note = pitch % 12;
	return note == 1 || note == 3 || note == 6 || note == 8 || note == 10;
}

SynthEngine synth_engine = { .master_volume = 1.0f };

fn void SynthEngine.note_on(&self, Pitch pitch, float velocity) {
	Voice* target = null;
	foreach (&v : self.voices) {
		if (v.active && v.pitch == pitch) { target = v; break; }
	}
	if (!target) {
		foreach (&v : self.voices) {
			if (!v.active) { target = v; break; }
		}
	}
	if (target) {
		target.active = true;
		target.pitch = pitch;
		target.freq = pitch_to_freq(pitch);
		target.target_amp = BASE_VOICE_AMP * velocity;
		target.instrument_type = self.current_instrument;
		target.amp = 0.0f;
		target.phase = 0.0f;
	}
}

fn void SynthEngine.note_off(&self, Pitch pitch) {
	foreach (&v : self.voices) {
		if (v.active && v.pitch == pitch) v.target_amp = 0.0f;
	}
}

fn bool SynthEngine.is_key_idx_active(&self, int key_idx, int octave_shift) {
	Pitch expected = (Pitch)(VISUAL_BASE_PITCH + key_idx + octave_shift);
	foreach (v : self.voices) {
		if (v.active && v.target_amp > 0.0f && v.pitch == expected) return true;
	}
	return false;
}

float[1024] audio_buffer;

fn float* SynthEngine.render_buffer(&self, int samples) {
	for (int i = 0; i < samples; i++) {
		float mixed_sample = 0.0f;

		foreach (&v : self.voices) {
			if (!v.active) continue;

			if (v.target_amp > v.amp) {
				v.amp += 0.0008f;
				if (v.amp > v.target_amp) v.amp = v.target_amp;
			} else if (v.target_amp < v.amp) {
				v.amp -= 0.0003f;
				if (v.amp <= 0.0f) {
					v.amp = 0.0f;
					v.active = false;
					continue;
				}
			}

			v.phase += v.freq / (float)SAMPLE_RATE;
			if (v.phase > 1.0f) v.phase -= 1.0f;

			float p = v.phase;
			float raw_wave = 0.0f;

			switch (v.instrument_type) {
				case 0:
					float sine1 = math::sin(p * (float)math::TWO_PI);
					float sine2 = math::sin(p * 2.0f * (float)math::TWO_PI) * 0.16f;
					float tri = (math::abs(p * 2.0f - 1.0f) * 2.0f - 1.0f) * 0.05f;
					raw_wave = sine1 + sine2 + tri;
				case 1: raw_wave = (p < 0.5f ? 0.35f : -0.35f);
				case 2: raw_wave = (p * 2.0f - 1.0f) * 0.3f;
				case 3: raw_wave = (math::abs(p * 2.0f - 1.0f) * 2.0f - 1.0f) * 0.4f;
				case 4:
					float fm = math::sin(p * (float)math::TWO_PI * 3.5f) * 0.6f;
					raw_wave = math::sin(p * (float)math::TWO_PI + fm) * 0.35f;
				case 5:
					float saw = (p * 2.0f - 1.0f) * 0.25f;
					float harmonic = math::sin(p * (float)math::TWO_PI * 2.0f) * 0.12f;
					raw_wave = saw + harmonic;
				case 6:
					float body = math::sin(p * (float)math::TWO_PI) * 0.3f;
					float snap = (p < 0.2f ? 0.2f : -0.05f);
					raw_wave = body + snap;
				case 7:
					float saw1 = (p * 2.0f - 1.0f) * 0.2f;
					float p2 = p * 1.008f;
					float saw2 = ((p2 - math::floor(p2)) * 2.0f - 1.0f) * 0.2f;
					raw_wave = saw1 + saw2;
				case 8:
					float sq = (p < 0.4f ? 0.35f : -0.35f);
					float sub = math::sin(p * (float)math::TWO_PI * 0.5f) * 0.2f;
					raw_wave = sq + sub;
				default:
					raw_wave = math::sin(p * (float)math::TWO_PI) * 0.35f;
			}
			mixed_sample += raw_wave * v.amp;
		}
		audio_buffer[i] = mixed_sample * self.master_volume;
	}
	return &audio_buffer;
}

// SEQUENCER (Transport & Timeline)
struct NoteEvent {
	Pitch pitch;
	float start_time;
	float duration;
	float velocity;
}

const int MAX_RECORDED_EVENTS = 1024 * 16;

struct Sequencer {
	NoteEvent[MAX_RECORDED_EVENTS] events;
	int event_count;
	bool initialized;

	bool is_recording;
	float record_timer;
	float[256] pending_start_times;

	bool is_playing;
	float play_timer;
	int play_head;
	bool[MAX_RECORDED_EVENTS] active_events;
}

Sequencer sequencer;

fn int parse_pitch_from_string(String s) {
	if (s.len < 2) return -1;

	sz name_len = 0;
	while (name_len < s.len && !s[name_len].is_digit() && s[name_len] != '-') {
		name_len++;
	}
	if (name_len == 0 || name_len >= s.len) return -1;

	String root_name = s[0..name_len - 1];
	String oct_str = s[name_len..s.len - 1];

	int note_idx = -1;
	for (int n = 0; n < 12; n++) {
		if (root_name == ALL_NOTE_NAMES[n]) {
			note_idx = n;
			break;
		}
	}
	if (note_idx == -1) return -1;

	int octave = oct_str.to_int() ?? -99;
	if (octave == -99) return -1;

	int pitch = (octave + 1) * 12 + note_idx;
	return (pitch >= 0 && pitch <= 127) ? pitch : -1;
}

fn bool Sequencer.load_from_text(&self, String text) {
	if (text.len == 0) return false;

	String[] tokens = text.tsplit(" ", skip_empty: true);
	int count = 0;

	foreach (token : tokens) {
		String trimmed = token.trim();
		if (trimmed.len == 0) continue;

		String[] parts = trimmed.tsplit(":");
		if (parts.len < 3) continue;

		int pitch_num = parse_pitch_from_string(parts[0]);
		if (pitch_num < 0 || pitch_num > 127) continue;

		float start_time = parts[1].to_float() ?? -1.0f;
		float duration = parts[2].to_float() ?? -1.0f;
		if (start_time < 0.0f || duration <= 0.0f) continue;

		if (count < MAX_RECORDED_EVENTS) {
			self.events[count++] = {
				.pitch = (Pitch)pitch_num,
				.start_time = start_time,
				.duration = duration,
				.velocity = 1.0f
			};
		}
	}

	if (count > 0) {
		self.event_count = count;
		sort::quicksort(self.events[:count], fn int(NoteEvent* a, NoteEvent* b) {
			if (a.start_time < b.start_time) return -1;
			if (a.start_time > b.start_time) return 1;
			return 0;
		});
		io::printfn("[SEQUENCER] Loaded %d notes from USER_SONG_TEXT!", count);
		return true;
	}
	return false;
}

fn void Sequencer.init(&self) {
	if (!self.initialized) {
		self.initialized = true;
		self.load_from_text(USER_SONG_TEXT);
	}
}

fn void Sequencer.start_recording(&self) {
	if (self.is_playing) self.stop_playback();
	self.is_recording = true;
	self.record_timer = 0.0f;
	self.event_count = 0;
	self.pending_start_times[..] = -1.0f;
	io::printn(" [MIDI RECORDING STARTED]");
	io::printn(" Press [ENTER] again to stop.");
}

fn void Sequencer.stop_recording(&self) {
	self.is_recording = false;
	io::printfn(" [MIDI RECORDING FINISHED] Recorded %d Notes", self.event_count);
	io::printn(" Sequence Text (paste into USER_SONG_TEXT):");
	io::printn(" -------------------------------------------------------");

	for (int i = 0; i < self.event_count; i++) {
		NoteEvent ev = self.events[i];
		int note_in_oct = ev.pitch % 12;
		int oct = (ev.pitch / 12) - 1;
		String p_name = ALL_NOTE_NAMES[note_in_oct];
		io::printf("%s%d:%.2f:%.2f ", p_name, oct, ev.start_time, ev.duration);
		if ((i + 1) % 6 == 0 || i == self.event_count - 1) {
			io::printn();
		}
	}
	io::printn(" -------------------------------------------------------");
	io::printn(" Press [SPACE] to Playback this sequence!");
}

fn void Sequencer.toggle_recording(&self) {
	if (self.is_recording) {
		self.stop_recording();
	} else {
		self.start_recording();
	}
}

fn void Sequencer.start_playback(&self) {
	if (self.event_count == 0) {
		io::printn("[SEQUENCER] No recorded notes to play! Press [ENTER] to record first.");
		return;
	}
	if (self.is_recording) self.stop_recording();
	self.is_playing = true;
	self.play_timer = 0.0f;
	self.play_head = 0;
	self.active_events[..] = false;
	io::printfn("[SEQUENCER] Playing back %d notes...", self.event_count);
}

fn void Sequencer.stop_playback(&self) {
	self.is_playing = false;
	for (int i = 0; i < self.event_count; i++) {
		if (self.active_events[i]) {
			midi_router.dispatch_note_off(self.events[i].pitch, false);
			self.active_events[i] = false;
		}
	}
	io::printn("[SEQUENCER] Playback stopped.");
}

fn void Sequencer.toggle_playback(&self) {
	if (self.is_playing) {
		self.stop_playback();
	} else {
		self.start_playback();
	}
}

fn void Sequencer.on_note_start(&self, Pitch pitch, float velocity) {
	if (self.is_recording) self.pending_start_times[pitch] = self.record_timer;
}

fn void Sequencer.on_note_stop(&self, Pitch pitch) {
	if (self.is_recording && self.pending_start_times[pitch] >= 0.0f) {
		float start = self.pending_start_times[pitch];
		float dur = self.record_timer - start;
		self.pending_start_times[pitch] = -1.0f;
		if (dur >= 0.03f && self.event_count < MAX_RECORDED_EVENTS) {
			self.events[self.event_count++] = {
				.pitch = pitch, .start_time = start, .duration = dur, .velocity = 1.0f
			};
		}
	}
}

fn void Sequencer.update(&self, float dt) {
	if (self.is_recording) self.record_timer += dt;

	if (self.is_playing) {
		self.play_timer += dt;

		for (int i = 0; i < self.play_head; i++) {
			if (self.active_events[i]) {
				NoteEvent ev = self.events[i];
				if ((ev.start_time + ev.duration) <= self.play_timer) {
					midi_router.dispatch_note_off(ev.pitch, false);
					self.active_events[i] = false;
				}
			}
		}

		while (self.play_head < self.event_count && self.events[self.play_head].start_time <= self.play_timer) {
			NoteEvent ev = self.events[self.play_head];
			int key_idx = visualizer.pitch_to_key_idx(ev.pitch);
			midi_router.dispatch_note_on_with_key_idx(ev.pitch, 1.0f, key_idx, false);
			self.active_events[self.play_head] = true;
			self.play_head++;
		}

		float last_end = 0.0f;
		if (self.event_count > 0) {
			NoteEvent last_ev = self.events[self.event_count - 1];
			last_end = last_ev.start_time + last_ev.duration;
		}
		if (self.play_timer > last_end + 0.5f) self.stop_playback();
	}
}

// MIDI ROUTER (Input & Polyphony Tracker)
struct MidiRouter {
	bool is_oct_down_held;
	bool is_oct_up_held;
	bool mouse_is_down;

	Pitch[256] key_to_active_pitch;
	int[256] key_to_key_idx;

	int mouse_active_idx;
	Pitch mouse_active_pitch;
	bool[256] user_is_holding_pitch;
}

MidiRouter midi_router;

fn int MidiRouter.get_octave_shift(&self) {
	if (self.is_oct_up_held) return 12;
	if (self.is_oct_down_held) return -12;
	return 0;
}

fn void MidiRouter.dispatch_note_on_with_key_idx(&self, Pitch pitch, float velocity, int key_idx, bool recordable) {
	if (self.user_is_holding_pitch[pitch]) return;
	self.user_is_holding_pitch[pitch] = true;

	synth_engine.note_on(pitch, velocity);
	if (recordable) sequencer.on_note_start(pitch, velocity);

	if (key_idx >= 0 && key_idx < VISUAL_KEY_COUNT) {
		visualizer.spawn_streak(pitch, visualizer.key_geometries[key_idx].center_x, VISUAL_PITCH_CONFIGS[key_idx].color);
	} else {
		visualizer.spawn_streak(pitch, visualizer.key_geometries[VISUAL_KEY_COUNT / 2].center_x, COLOR_OCT_UP);
	}
}

fn void MidiRouter.dispatch_note_off(&self, Pitch pitch, bool recordable) {
	if (!self.user_is_holding_pitch[pitch]) return;
	self.user_is_holding_pitch[pitch] = false;

	synth_engine.note_off(pitch);
	if (recordable) sequencer.on_note_stop(pitch);
	visualizer.release_streak(pitch);
}

fn void MidiRouter.shift_active_notes(&self, int old_shift, int new_shift) {
	if (old_shift == new_shift) return;
	int diff = new_shift - old_shift;

	for (int k = 0; k < 256; k++) {
		Pitch old_p = self.key_to_active_pitch[k];
		if (old_p != 0 && self.user_is_holding_pitch[old_p]) {
			int new_p_num = (int)old_p + diff;
			if (new_p_num >= 0 && new_p_num <= 127) {
				Pitch new_p = (Pitch)new_p_num;
				int key_idx = self.key_to_key_idx[k];
				self.dispatch_note_off(old_p, true);
				self.key_to_active_pitch[k] = new_p;
				self.dispatch_note_on_with_key_idx(new_p, 1.0f, key_idx, true);
			}
		}
	}

	if (self.mouse_active_pitch != 0 && self.user_is_holding_pitch[self.mouse_active_pitch]) {
		int new_p_num = (int)self.mouse_active_pitch + diff;
		if (new_p_num >= 0 && new_p_num <= 127) {
			Pitch new_p = (Pitch)new_p_num;
			self.dispatch_note_off(self.mouse_active_pitch, true);
			self.mouse_active_pitch = new_p;
			self.dispatch_note_on_with_key_idx(new_p, 1.0f, self.mouse_active_idx, true);
		}
	}
}

fn int MidiRouter.key_code_to_key_idx(&self, int k) {
	if (k == 241 || k == 209) return 16;
	char c = ((char)k).to_lower();

	switch (c) {
		case 'a': return 0;
		case 'w': return 1;
		case 's': return 2;
		case 'e': return 3;
		case 'd': return 4;
		case 'f': return 5;
		case 't': return 6;
		case 'g': return 7;
		case 'y': return 8;
		case 'h': return 9;
		case 'u': return 10;
		case 'j': return 11;
		case 'k': return 12;
		case 'o': return 13;
		case 'l': return 14;
		case 'p': return 15;
		case ';': return 16;
		default:  return -1;
	}
}

fn void MidiRouter.process_events(&self, Event[] events) {
	foreach (event : events) {
		switch (event.kind) {
			case MOUSE_DOWN:
				self.mouse_is_down = true;
				int touched_idx = visualizer.pitch_idx_at_pos(event.mouse_pos);
				if (touched_idx != -1) {
					self.mouse_active_idx = touched_idx;
					int pitch_num = (int)VISUAL_BASE_PITCH + touched_idx + self.get_octave_shift();
					if (pitch_num >= 0 && pitch_num <= 127) {
						self.mouse_active_pitch = (Pitch)pitch_num;
						self.dispatch_note_on_with_key_idx(self.mouse_active_pitch, 1.0f, touched_idx, true);
					}
				}

			case MOUSE_MOVE:
				if (self.mouse_is_down) {
					int hovered_idx = visualizer.pitch_idx_at_pos(event.mouse_pos);
					if (hovered_idx != self.mouse_active_idx) {
						if (self.mouse_active_pitch != 0) {
							self.dispatch_note_off(self.mouse_active_pitch, true);
							self.mouse_active_pitch = 0;
						}
						self.mouse_active_idx = hovered_idx;
						if (self.mouse_active_idx != -1) {
							int new_p = (int)VISUAL_BASE_PITCH + self.mouse_active_idx + self.get_octave_shift();
							if (new_p >= 0 && new_p <= 127) {
								self.mouse_active_pitch = (Pitch)new_p;
								self.dispatch_note_on_with_key_idx(self.mouse_active_pitch, 1.0f, self.mouse_active_idx, true);
							}
						}
					}
				}

			case MOUSE_UP:
				self.mouse_is_down = false;
				if (self.mouse_active_pitch != 0) {
					self.dispatch_note_off(self.mouse_active_pitch, true);
					self.mouse_active_pitch = 0;
				}
				self.mouse_active_idx = -1;

			case WHEEL:
				if (event.wheel != 0.0f) {
					synth_engine.master_volume = math::clamp(synth_engine.master_volume + event.wheel * 0.08f, 0.0f, 2.0f);
					synth_engine.volume_hud_timer = 2.0f;
				}

			case KEY_DOWN:
				int k = (int)((char)event.key).to_lower();
				int prev_shift = self.get_octave_shift();

				switch (k) {
					case 'z':
						self.is_oct_down_held = true;
						self.shift_active_notes(prev_shift, self.get_octave_shift());
					case 'x':
						self.is_oct_up_held = true;
						self.shift_active_notes(prev_shift, self.get_octave_shift());
					case KEY_ENTER: case KEY_RETURN:
						sequencer.toggle_recording();
					case KEY_SPACE:
						sequencer.toggle_playback();
					default:
						switch (true) {
							case k >= '1' && k <= '9':
								synth_engine.current_instrument = k - '1';
								synth_engine.inst_hud_timer = 2.5f;
							default:
								int idx = self.key_code_to_key_idx(k);
								if (idx != -1) {
									int pitch_num = (int)VISUAL_BASE_PITCH + idx + self.get_octave_shift();
									if (pitch_num >= 0 && pitch_num <= 127) {
										Pitch p = (Pitch)pitch_num;
										self.key_to_active_pitch[k] = p;
										self.key_to_key_idx[k] = idx;
										self.dispatch_note_on_with_key_idx(p, 1.0f, idx, true);
									}
								}
						}
				}

			case KEY_UP:
				int k = (int)((char)event.key).to_lower();
				int prev_shift = self.get_octave_shift();

				switch (k) {
					case 'z':
						self.is_oct_down_held = false;
						self.shift_active_notes(prev_shift, self.get_octave_shift());
					case 'x':
						self.is_oct_up_held = false;
						self.shift_active_notes(prev_shift, self.get_octave_shift());
					case KEY_ENTER: case KEY_RETURN: case KEY_SPACE:
						break;
					default:
						switch (true) {
							case k >= '1' && k <= '9':
								break;
							default:
								Pitch active_p = self.key_to_active_pitch[k];
								if (active_p != 0) {
									self.dispatch_note_off(active_p, true);
									self.key_to_active_pitch[k] = 0;
								} else {
									int idx = self.key_code_to_key_idx(k);
									if (idx != -1) {
										int pitch_num = (int)VISUAL_BASE_PITCH + idx + self.get_octave_shift();
										if (pitch_num >= 0 && pitch_num <= 127) {
											self.dispatch_note_off((Pitch)pitch_num, true);
										}
									}
								}
						}
				}

			default: break;
		}
	}
}

// VISUALIZER (Waterfall & Piano UI Renderer)
enum EventKind : char {
	NONE, MOUSE_MOVE, MOUSE_DOWN, MOUSE_UP, KEY_DOWN, KEY_UP, WHEEL
}

struct Event {
	EventKind kind;
	Vec2 mouse_pos;
	float wheel;
	int mouse_button;
	int key;
}

struct KeyGeometry {
	float key_x;
	float key_w;
	float center_x;
}

struct Streak {
	bool active;
	Pitch pitch;
	float x;
	float head_y;
	float tail_y;
	float speed;
	bool is_holding;
	Rgba color;
}

struct Particle {
	bool active;
	Vec2 pos;
	Vec2 vel;
	float life;
	float max_life;
	Rgba color;
}

const int MAX_STREAKS = 128;
const int MAX_PARTICLES = 256;
const float PIANO_HEIGHT = 90.0f;

struct Canvas {
	Rgba[] pixels;
	int width;
	int height;
}

fn void Canvas.clear(&self, Rgba col) { self.pixels[..] = col; }

fn void Canvas.draw_pixel(&self, IVec2 pos, Rgba col) {
	if (pos.x >= 0 && pos.x < self.width && pos.y >= 0 && pos.y < self.height) {
		self.pixels[pos.y * self.width + pos.x] = col;
	}
}

fn void Canvas.draw_rect(&self, IVec2 pos, IVec2 size, Rgba col) {
	int min_x = math::clamp(pos.x, 0, self.width);
	int max_x = math::clamp(pos.x + size.x, 0, self.width);
	int min_y = math::clamp(pos.y, 0, self.height);
	int max_y = math::clamp(pos.y + size.y, 0, self.height);

	for (int y = min_y; y < max_y; y++) {
		for (int x = min_x; x < max_x; x++) {
			self.pixels[y * self.width + x] = col;
		}
	}
}

fn void Canvas.draw_circle(&self, Vec2 center, float r, Rgba col) {
	int min_x = math::clamp((int)(center.x - r), 0, self.width);
	int max_x = math::clamp((int)(center.x + r + 1.0f), 0, self.width);
	int min_y = math::clamp((int)(center.y - r), 0, self.height);
	int max_y = math::clamp((int)(center.y + r + 1.0f), 0, self.height);

	float r_sq = r * r;
	for (int y = min_y; y < max_y; y++) {
		for (int x = min_x; x < max_x; x++) {
			Vec2 d = (Vec2){ (float)x, (float)y } - center;
			if (d.x * d.x + d.y * d.y <= r_sq) {
				self.pixels[y * self.width + x] = col;
			}
		}
	}
}

const ushort[128] CHAR_BITMAPS = {
	['A'] = 0b010_101_111_101_101, ['B'] = 0b110_101_110_101_110,
	['C'] = 0b011_100_100_100_011, ['D'] = 0b110_101_101_101_110,
	['E'] = 0b111_100_110_100_111, ['F'] = 0b111_100_110_100_100,
	['G'] = 0b011_100_101_101_011, ['H'] = 0b101_101_111_101_101,
	['I'] = 0b111_010_010_010_111, ['J'] = 0b001_001_001_101_010,
