<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>C3 Playground</title>
	<link rel="icon" href="https://c3-lang.org/assets/favicon.svg">
	<style>
		:root {
			--bg-dark: #0f172a;
			--panel-bg: #1e293b;
			--border: #334155;
			--accent: #38bdf8;
			--accent-hover: #0284c7;
			--text-main: #f8fafc;
			--text-muted: #94a3b8;
			--console-bg: #090d16;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: var(--bg-dark);
			color: var(--text-main);
			height: 100vh;
			display: flex;
			flex-direction: column;
		}

		header {
			background-color: var(--panel-bg);
			border-bottom: 1px solid var(--border);
			padding: 12px 24px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		header h1 img {
			height: 24px;
			width: auto;
		}

		header h1 {
			font-size: 1.25rem;
			font-weight: 600;
			color: var(--accent);
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
		}

		/* Documentation Link Style */
		.docs-link {
			font-size: 0.85rem;
			color: var(--text-muted);
			text-decoration: none;
			font-weight: normal;
			display: inline-flex;
			align-items: center;
			gap: 4px;
			transition: color 0.2s ease;
		}

		.docs-link:hover {
			color: var(--accent);
		}

		.controls {
			display: flex;
			gap: 12px;
			align-items: center;
		}

		select,
		button {
			font-size: 0.9rem;
			padding: 8px 16px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--bg-dark);
			color: var(--text-main);
			cursor: pointer;
			transition: all 0.2s ease;
		}

		select:focus,
		button:focus {
			outline: none;
			border-color: var(--accent);
		}

		button.primary {
			background-color: var(--accent);
			color: #0f172a;
			font-weight: 600;
			border: none;
		}

		button.primary:hover:not(:disabled) {
			background-color: var(--accent-hover);
			color: #fff;
		}

		button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		/* Status Badge & Custom Monospaced Tooltip Container */
		.status-container {
			position: relative;
			display: inline-flex;
			align-items: center;
		}

		.status-badge {
			font-size: 0.8rem;
			padding: 4px 8px;
			border-radius: 12px;
			background: #334155;
			color: var(--text-muted);
			transition: all 0.2s ease;
			user-select: none;
		}

		.status-badge.ready {
			background: #064e3b;
			color: #34d399;
			cursor: pointer;
		}

		.status-badge.ready:hover {
			background: #047857;
			color: #10b981;
		}

		.status-badge.compiling {
			background: #78350f;
			color: #fbbf24;
		}

		/* Custom HTML/CSS Tooltip (Positioned below the badge to prevent page overflow) */
		.status-tooltip {
			opacity: 0;
			visibility: hidden;
			position: absolute;
			top: calc(100% + 8px);
			/* Positioned cleanly beneath the badge */
			right: 0;
			background-color: #0b1329;
			border: 1px solid var(--border);
			color: #e2e8f0;
			padding: 12px;
			border-radius: 6px;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 0.75rem;
			line-height: 1.5;
			white-space: pre;
			z-index: 1000;
			box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.6), 0 4px 6px -4px rgba(0, 0, 0, 0.6);
			pointer-events: none;
			transition: opacity 0.2s ease, visibility 0.2s ease;
		}

		/* Reveal the tooltip exclusively when hovering a 'Ready' status badge */
		.status-container:hover .status-badge.ready~.status-tooltip {
			opacity: 1;
			visibility: visible;
		}

		main {
			flex: 1;
			display: grid;
			grid-template-columns: 1fr 10px 1fr;
			padding: 12px;
			overflow: hidden;
			box-sizing: border-box;
		}

		.pane {
			background: var(--panel-bg);
			border: 1px solid var(--border);
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		/* Resizer Drag Handle Styling */
		.resizer {
			width: 10px;
			cursor: col-resize;
			background: transparent;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 10;
			user-select: none;
		}

		.resizer::after {
			content: "";
			width: 2px;
			height: 40px;
			background-color: var(--border);
			border-radius: 1px;
			transition: background-color 0.2s ease, height 0.2s ease, width 0.2s ease;
		}

		.resizer:hover::after,
		.resizer.dragging::after {
			background-color: var(--accent);
			height: 100%;
		}

		.pane-header {
			background: rgba(15, 23, 42, 0.4);
			padding: 8px 16px;
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--text-muted);
			border-bottom: 1px solid var(--border);
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		/* Editor Action Controls */
		.editor-actions {
			display: flex;
			gap: 8px;
		}

		.icon-btn {
			background: transparent;
			border: none;
			color: var(--text-muted);
			padding: 4px;
			cursor: pointer;
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s ease;
		}

		.icon-btn:hover {
			color: var(--accent);
			background: rgba(56, 189, 248, 0.1);
		}

		.icon-btn svg {
			width: 16px;
			height: 16px;
		}

		#code {
			flex: 1;
			width: 100%;
			min-height: 0;
		}

		pre {
			flex: 1;
			background: var(--console-bg);
			color: #38bdf8;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 13px;
			line-height: 1.5;
			padding: 16px;
			overflow-y: auto;
			white-space: pre-wrap;
			word-break: break-all;
		}

		/* Clickable Compiler Links inside Output Console */
		.console-link:hover {
			text-decoration: underline !important;
			color: #0284c7 !important;
		}

		/* Responsive Mobile Layout Stack Rules */
		@media (max-width: 768px) {
			main {
				grid-template-columns: 1fr !important;
				grid-template-rows: 1fr 10px 1fr;
			}

			.resizer {
				width: 100%;
				height: 10px;
				cursor: row-resize;
			}

			.resizer::after {
				width: 40px;
				height: 2px;
			}

			.resizer:hover::after,
			.resizer.dragging::after {
				width: 100%;
				height: 2.2px;
			}
		}

		@media (max-width: 480px) {
			header {
				padding: 12px;
				flex-direction: column;
				gap: 12px;
				align-items: stretch;
			}

			.controls {
				width: 100%;
				justify-content: space-between;
			}

			select {
				flex: 1;
				max-width: 150px;
			}
		}
	</style>
</head>

	<script type="text/c3" id="example-slices_and_defer">module main;
import std;

fn void heap_example()
{
	io::printn("--- 1. Manual Allocation with 'defer' ---");
	// mem::new_array allocates a zero-initialized array (slice) on the heap.
	// Unlike standard C, this returns a safe, sized slice (int[]) rather than a raw pointer.
	int[] array = mem::new_array(int, 5);

	// 'defer' guarantees memory cleanup at scope exit, preventing leaks without RAII overhead
	defer mem::free(array);

	for (int i = 0; i < array.len; i++)
	{
		array[i] = (i + 1) * 10;
	}

	foreach (idx, val : array) // foreach loops work naturally on slices
	{
		io::printfn("array[%d] = %d", idx, val);
	}
}

fn void temp_example()
{
	io::printn("\n--- 2. Temporary Arena Allocation ---");
	// The @pool macro sets up a temporary allocator scope.
	// All temporary allocations within this block are automatically freed on block exit.
	@pool()
	{
		double[] temp_vals = mem::temp_array(double, 4); // Allocate a temporary double array using the arena allocator
		temp_vals[0] = 3.14;
		temp_vals[1] = 1.61;
		temp_vals[2] = 2.71;
		temp_vals[3] = 1.41;

		double[] sub_slice = temp_vals[1:2]; // Create a sub-slice on the fly using slice syntax [start:length]

		foreach (idx, val : sub_slice)
		{
			io::printfn("sub_slice[%d] = %.2f", idx, val);
		}

		io::printn("Leaving @pool scope... (all temp memory is automatically reclaimed)");
	};
}

fn void main()
{
	heap_example();
	temp_example();
}
</script>

	<script type="text/c3" id="example-reflection">module main;
import std;

struct Point {
	int x;
	int y;
	double depth;
}

// Compile-time macro to introspect struct definitions
macro print_fields($Type) {
	$foreach $field : $Type::members:
		// Use dot notation (.) to access compile-time member properties
		io::printfn("Field '%s' | Offset: %d bytes | Size: %d bytes",
			$field.name, $field.offset, $field.size);
	$endforeach
}

fn int main()
{
	io::printn("--- 1. Type Metadata ---");
	// We can query compile-time type properties using the :: syntax
	io::printfn("Name:        %s", Point::name);
	io::printfn("Total Size:  %d bytes", Point::size);
	io::printfn("Is Struct?   %s", Point::kind == STRUCT ? "Yes" : "No");

	io::printn("\n--- 2. Struct Fields Reflection ---");
	// Generate code at compile-time that prints the layout
	print_fields(Point);

	return 0;
}
</script>

	<script type="text/c3" id="example-json_pretty_print">
module main;
import std;

fn int main()
{
	String file = `
{"id":12345,"name":"Alice Johnson","email":"alice@example.com","active":true,"roles":["admin","editor"],"profile":{"city":"Buenos Aires","country":"Argentina"},"lastLogin":"2026-08-01T12:34:56Z","preferences":{"theme":"dark","notifications":true}}
`;

	Object*? json_object = json::tparse(file);
	if (catch err = json_object)
	{
		io::printfn("Error: Failed to parse JSON (%s)", err);
		return 1;
	}

	if (catch err = json::marshal_to(io::stdout(), json_object, SPACE_4))
	{
		io::printfn("Error: Failed to write pretty printed JSON (%s)", err);
		return 1;
	}

	io::printn();

	return 0;
}
</script>

	<script type="text/c3" id="example-vectors">module main;
import std;

fn void main()
{
	// C3 natively supports hardware-backed SIMD vector types using [<>] syntax
	float[<3>] position = { 1.0, 2.0, 3.0 };
	float[<3>] velocity = { 0.5, -1.0, 1.5 };

	io::printn("--- 1. Vector Arithmetic & Dot Methods ---");
	// Vector arithmetic is performed elementwise out-of-the-box
	float[<3>] next_pos = position + velocity * 2.0;
	io::printfn("Initial Position:  [%f, %f, %f]", position.x, position.y, position.z);
	io::printfn("Velocity:          [%f, %f, %f]", velocity.x, velocity.y, velocity.z);
	io::printfn("Position + Vel*2:  [%f, %f, %f]", next_pos.x, next_pos.y, next_pos.z);

	// Standard vector operations via dot-method syntax
	float len = velocity.length();
	float[<3>] normalized = velocity.normalize();
	io::printfn("Velocity Length:   %f", len);
	io::printfn("Velocity Norm:     [%f, %f, %f]", normalized.x, normalized.y, normalized.z);

	io::printn("\n--- 2. Vector Swizzling & Extraction ---");
	// Swizzling allows extracting or rearranging components easily
	float[<2>] horizontal_vel = velocity.xy;
	float[<3>] reversed_pos = position.zyx;
	io::printfn("Horizontal Vel (xy): [%f, %f]", horizontal_vel.x, horizontal_vel.y);
	io::printfn("Reversed Pos (zyx):  [%f, %f, %f]", reversed_pos.x, reversed_pos.y, reversed_pos.z);

	io::printn("\n--- 3. Dot Product & Reflection ---");
	// Physics simulation: reflecting an incident vector off a normal
	float[<3>] incident = { 1.0, -1.0, 0.0 };
	float[<3>] normal = { 0.0, 1.0, 0.0 }; // Pointing straight up

	float[<3>] reflected = incident.reflect(normal);
	float dot_prod = incident.dot(normal);

	io::printfn("Incident:    [%f, %f, %f]", incident.x, incident.y, incident.z);
	io::printfn("Normal:      [%f, %f, %f]", normal.x, normal.y, normal.z);
	io::printfn("Dot Product: %f", dot_prod);
	io::printfn("Reflected:   [%f, %f, %f]", reflected.x, reflected.y, reflected.z);
}
</script>

	<script type="text/c3" id="example-errors">module main;
import std;

faultdef INVALID_CHAR, OUT_OF_RANGE; // Custom faults are declared globally

fn int? parse_digit(char c) // This function returns an Optional int (either an int or a fault)
{
	if (c < '0' || c > '9') {
		return INVALID_CHAR~; // Use '~' to return a fault as an empty optional
	}
	return (int)(c - '0');
}

fn int? parse_and_double(char c)
{
	int digit = parse_digit(c)!; // The '!' operator propagates/bubbles up the fault if parse_digit fails
	return (digit > 4) ? OUT_OF_RANGE~! : digit * 2;
}

fn void main()
{
	char[3] test_chars = { '3', '7', 'a' };

	foreach (c : test_chars) {
		int? val = parse_and_double(c);

		// Unwrapping the optional cleanly with 'if (catch ...)'
		if (catch err = val)
		{
			io::printfn("Character '%c': Failed with error %s", c, err);
		}
		else
		{
			// Inside this block, 'val' is automatically unwrapped to a standard 'int'
			io::printfn("Character '%c': Success, doubled value is %d", c, val);
		}
	}
}
</script>

	<script type="text/c3" id="example-bitstructs">module main;
import std;

// Bitstructs map fields into a specific backing integer layout
bitstruct CpuStatus : ushort {
	bool carry     : 0;
	bool zero      : 1;
	bool interrupt : 2;
	uint reserved  : 3..7;
	uint mode      : 8..11;
}

fn int main() {
	// Designated initialization
	CpuStatus status = {
		.carry = true,
		.zero = false,
		.interrupt = true,
		.reserved = 15,
		.mode = 9
	};

	io::printn("--- 1. Reading Bitstruct Fields ---");
	io::printfn("Carry Flag:     %s", status.carry);
	io::printfn("Zero Flag:      %s", status.zero);
	io::printfn("Interrupt Flag: %s", status.interrupt);
	io::printfn("Reserved Bits:  %d", status.reserved);
	io::printfn("Processor Mode: %d", status.mode);

	io::printn("\n--- 2. Casting & Inspecting Backing Type ---");
	ushort raw_value = (ushort)status;
	io::printfn("Raw ushort (Hex):     0x%04X (Decimal: %d)", raw_value, raw_value);

	// C3 natively supports binary formatting via %b (including zero-padding like %016b)
	io::printfn("Raw ushort (Binary):  %016b", raw_value);
	io::printn("                      Mode Resrvd Flags");

	io::printn("\n--- 3. Mutating Fields ---");
	status.carry = false;
	status.mode = 12;

	ushort mutated_value = (ushort)status;
	io::printfn("New ushort (Hex):     0x%04X", mutated_value);
	io::printfn("New ushort (Binary):  %016b", mutated_value);

	return 0;
}</script>

		// Native Async GZIP compression via browser's Compression Streams API (dependency-free)
		async function compressCode(str) {
			const byteArray = new TextEncoder().encode(str);
			const cs = new CompressionStream("gzip");
			const writer = cs.writable.getWriter();
			writer.write(byteArray);
			writer.close();

			const response = new Response(cs.readable);
			const arrayBuffer = await response.arrayBuffer();

			const uint8 = new Uint8Array(arrayBuffer);
			let binary = "";
			for (let i = 0; i < uint8.byteLength; i++) {
				binary += String.fromCharCode(uint8[i]);
			}
			const base64 = btoa(binary);
			return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
		}

		// Native Async GZIP decompression via browser's Decompression Streams API
		async function decompressCode(safeBase64) {
			try {
				let base64 = safeBase64.replace(/-/g, '+').replace(/_/g, '/');
				while (base64.length % 4) {
					base64 += '=';
				}
				const binary = atob(base64);
				const bytes = new Uint8Array(binary.length);
				for (let i = 0; i < binary.length; i++) {
					bytes[i] = binary.charCodeAt(i);
				}

				const ds = new DecompressionStream("gzip");
				const writer = ds.writable.getWriter();
				writer.write(bytes);
				writer.close();

				const response = new Response(ds.readable);
				const arrayBuffer = await response.arrayBuffer();
				return new TextDecoder().decode(arrayBuffer);
			} catch (err) {
				console.error("Native decompression failed or parameters are malformed:", err);
				return null;
			}
		}

		function flattenDocgen(db) {
			const symbols = [];
			if (!db || !db.modules) {
				console.warn("[Flatten Database] Invalid database structural payload received:", db);
				return symbols;
			}

			for (const [moduleName, mod] of Object.entries(db.modules)) {
				const categories = ['functions', 'macros', 'types', 'globals', 'methods', 'constants', 'variables'];
				for (const cat of categories) {
					if (Array.isArray(mod[cat])) {
						for (const item of mod[cat]) {
							symbols.push({
								...item,
								module: moduleName,
								category: cat
							});
						}
					}
				}
			}
			console.log(`[Flatten Database] Successfully mapped ${symbols.length} global and standard library symbols.`);
			return symbols;
		}

		function getFullIdentifierAt(model, position) {
			const lineContent = model.getLineContent(position.lineNumber);
			const col = position.column;
			const regex = /[a-zA-Z_0-9]+(?:::[a-zA-Z_0-9]+|(?:\.[a-zA-Z_0-9]+))*/g;
			let match;
			while ((match = regex.exec(lineContent)) !== null) {
				const start = match.index + 1;
				const end = start + match[0].length;
				if (col >= start && col <= end) {
					return match[0];
				}
			}
			const word = model.getWordAtPosition(position);
			return word ? word.word : "";
		}

		function findSymbols(fullId) {
			if (!docDbSymbols || docDbSymbols.length === 0 || !fullId) {
				return [];
			}

			const normalizedId = fullId.replace(/\./g, '::');
			let matches = docDbSymbols.filter(s => {
				const uidNorm = s.uid.replace(/\./g, '::');
				return uidNorm === normalizedId || uidNorm.endsWith('::' + normalizedId);
			});

			if (matches.length > 0) {
				return matches;
			}

			const namePart = fullId.split(/::|\./).pop();
			const fallbackMatches = docDbSymbols.filter(s => s.name === namePart);
			return fallbackMatches;
		}

		function formatSymbolHover(sym) {
			const contents = [];
			let header = `**${sym.kind || 'definition'}** \`${sym.uid}\``;
			contents.push({ value: header });

			if (sym.docs && sym.docs.text) {
				contents.push({ value: sym.docs.text });
			}

			if (sym.docs && Array.isArray(sym.docs.params) && sym.docs.params.length > 0) {
				let paramText = `**Parameters:**\n`;
				for (const p of sym.docs.params) {
					paramText += `* \`${p.name}\`: ${p.description || ''}\n`;
				}
				contents.push({ value: paramText });
			}

			if (sym.docs && sym.docs.return) {
				contents.push({ value: `**Returns:** ${sym.docs.return}` });
			}

			if (sym.file) {
				contents.push({ value: `*Defined in \`${sym.file}\`*` });
			}

			return { contents: contents };
		}

		function formatConsoleOutput(text) {
			let escaped = text
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;");

			const linkRegex = /(?:\/main\.c3|main\.c3):(\d+)(?::(\d+))?/g;

			return escaped.replace(linkRegex, (match, line, col) => {
				const c = col ? col : 1;
				return `<span class="console-link" style="color: #38bdf8; text-decoration: none; cursor: pointer; font-weight: bold;" data-line="${line}" data-col="${c}">${match}</span>`;
			});
		}

		function parseCompilerErrors(stderrText) {
			const markers = [];
			const lines = stderrText.split('\n');
			const errorRegex = /(?:\/main\.c3|main\.c3):(\d+)(?::(\d+))?\)?\s*(Error|Warning):\s*(.*)/i;
			const model = editor.getModel();

			for (const line of lines) {
				const match = line.match(errorRegex);
				if (match) {
					const lineNum = parseInt(match[1], 10);
					const colNum = match[2] ? parseInt(match[2], 10) : 1;
					const severityStr = match[3].toLowerCase();
					const message = match[4].trim();

					const severity = severityStr === "error"
						? monaco.MarkerSeverity.Error
						: monaco.MarkerSeverity.Warning;

					let endColumn = colNum + 1;
					if (model) {
						const wordInfo = model.getWordAtPosition({ lineNumber: lineNum, column: colNum });
						if (wordInfo) {
							endColumn = wordInfo.endColumn;
						}
					}

					markers.push({
						severity: severity,
						message: message,
						startLineNumber: lineNum,
						startColumn: colNum,
						endLineNumber: lineNum,
						endColumn: endColumn
					});
				}
			}
			return markers;
		}

			if (sharedCode !== null) {
				exampleSelect.value = "";
			} else if (savedExample && examples[savedExample]) {
				exampleSelect.value = savedExample;
			} else {
				exampleSelect.value = "hello";
			}

			editor = monaco.editor.create(document.getElementById("code"), {
				value: initialCodeValue,
				language: 'c3',
				theme: 'c3PlaygroundTheme',
				automaticLayout: true,
				fontSize: 14,
				lineHeight: 22,
				fontFamily: "'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace",
				tabSize: 4,
				insertSpaces: false,
				detectIndentation: false,
				minimap: { enabled: true }
			});

			editor.layout();

			editor.onDidChangeModelContent(() => {
				localStorage.setItem("c3_playground_code", editor.getValue());
				queueDocgenUpdate();
			});

			editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, function () {
				if (!compileBtn.disabled) {
					compileBtn.click();
				}
			});

			editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
				saveCodeToDisk();
			});

			exampleSelect.onchange = () => {
				if (editor && examples[exampleSelect.value]) {
					editor.setValue(examples[exampleSelect.value]);
					localStorage.setItem("c3_playground_selected_example", exampleSelect.value);
					localStorage.setItem("c3_playground_code", examples[exampleSelect.value]);
					if (window.location.hash) {
						history.replaceState(null, null, ' ');
					}
				}
			};

			loadAndCompileCompiler();
		});

		let isAnyCompilerTaskRunning = false;
		let compilerWorkerBlobUrl = null;

		async function executeCompilerTask(taskType, sourceCode, onMessageCallback) {
			if (isAnyCompilerTaskRunning) {
				console.warn(`[Execute Task] A compiler task is already running. Skipping task of type '${taskType}'.`);
				return;
			}
			isAnyCompilerTaskRunning = true;

			if (taskType === "compile") {
				compileBtn.disabled = true;
				setStatus("Compiling...", "compiling");
			}

			console.log(`[Execute Task] Spawning new worker for task type: '${taskType}'`);
			if (!c3WorkerJsText) {
				console.error("[Execute Task] c3WorkerJsText is not loaded!");
				isAnyCompilerTaskRunning = false;
				if (taskType === "compile") {
					compileBtn.disabled = false;
					setStatus("Compiler Ready", "ready");
				}
				return;
			}

			if (!compilerWorkerBlobUrl) {
				const blob = new Blob([c3WorkerJsText], { type: 'application/javascript' });
				compilerWorkerBlobUrl = URL.createObjectURL(blob);
			}
			const tempWorker = new Worker(compilerWorkerBlobUrl);

			let initComplete = false;

			tempWorker.onerror = (err) => {
				console.warn(`[Execute Task] Worker of type '${taskType}' crashed/aborted unexpectedly. Terminating.`, err);
				tempWorker.terminate();
				isAnyCompilerTaskRunning = false;
				if (taskType === "compile") {
					outputEl.textContent += "\n[FATAL ERROR] Compiler worker crashed unexpectedly. Please refresh if issues persist.\n";
					compileBtn.disabled = false;
					setStatus("Compiler Ready", "ready");
				} else {
					docDbSymbols = [];
				}
				URL.revokeObjectURL(compilerWorkerBlobUrl);
				compilerWorkerBlobUrl = null;

				try {
					onMessageCallback({ type: `${taskType}_failed`, error: err.message || 'Worker crash' }, tempWorker);
				} catch (e) { }
			};

			tempWorker.onmessage = (e) => {
				const msg = e.data;

				if (msg.type === "ready") {
					initComplete = true;
					tempWorker.postMessage({ type: taskType, source: sourceCode });
					return;
				}

				if (taskType === "compile" && (msg.type === "stdout" || msg.type === "stderr")) {
					onMessageCallback(msg, tempWorker);
					return;
				}

				let callbackFinished = false;
				try {
					tempWorker.terminate();
					isAnyCompilerTaskRunning = false;
					if (taskType === "compile") {
						compileBtn.disabled = false;
						setStatus("Compiler Ready", "ready");
					}
					onMessageCallback(msg, tempWorker);
					callbackFinished = true;
				} finally {
					if (!callbackFinished) {
						tempWorker.terminate();
						isAnyCompilerTaskRunning = false;
						if (taskType === "compile") {
							compileBtn.disabled = false;
							setStatus("Compiler Ready", "ready");
						}
					}
				}
			};

			setTimeout(() => {
				if (!initComplete) {
					console.error(`[Execute Task] Worker of type '${taskType}' failed to initialize within timeout. Terminating.`);
					tempWorker.terminate();
					isAnyCompilerTaskRunning = false;
					if (taskType === "compile") {
						outputEl.textContent += "\n[FATAL ERROR] Compiler worker failed to initialize. Please refresh.\n";
						compileBtn.disabled = false;
						setStatus("Compiler Ready", "ready");
					} else {
						docDbSymbols = [];
					}
					URL.revokeObjectURL(compilerWorkerBlobUrl);
					compilerWorkerBlobUrl = null;

					try {
						onMessageCallback({ type: `${taskType}_failed`, error: 'Timeout' }, tempWorker);
					} catch (e) { }
				}
			}, 5000);

			tempWorker.postMessage({
				type: "init_module",
				wasmModule: compiledCompilerModule,
				c3cJs: c3cJsText,
				c3cData: c3cDataBuffer
			});
		}

		let compilerVersionText = "";

		async function queryCompilerVersion() {
			return new Promise((resolve) => {
				executeCompilerTask(
					"version",
					"",
					(msg, tempWorker) => {
						if (msg.type === "version_info") {
							compilerVersionText = msg.text.trim();
							// Render precisely aligned version payload inside the styled monospaced pre element
							statusTooltipEl.textContent = compilerVersionText;
							console.log("[Version query] Loaded compiler version info:\n", compilerVersionText);
						} else if (msg.type === "version_failed") {
							statusTooltipEl.textContent = "C3 Compiler Version information unavailable";
							console.warn("[Version query] Failed to fetch compiler version.");
						}
						resolve();
						return true;
					}
				);
			});
		}

		async function loadAndCompileCompiler() {
			compileBtn.disabled = true;
			setStatus("Loading Compiler...", "");
			try {
				console.log("Starting parallel download of all compiler assets...");

				const wasmFetchPromise = (async () => {
					let wasmBuffer;
					try {
						console.log("Attempting to fetch full build/c3c.wasm...");
						const res = await fetch('build/c3c.wasm');
						if (!res.ok) throw new Error('Not found');
						wasmBuffer = await res.arrayBuffer();
						console.log(`Successfully fetched full build/c3c.wasm (${wasmBuffer.byteLength} bytes)`);
					} catch (err) {
						console.log("Falling back to split files (build/c3c.wasm.part_aa/ab)...");
						const parts = ['build/c3c.wasm.part_aa', 'build/c3c.wasm.part_ab'];
						const buffers = await Promise.all(parts.map(url => fetch(url).then(res => {
							if (!res.ok) throw new Error('Failed to fetch ' + url);
							return res.arrayBuffer();
						})));
						const totalLen = buffers.reduce((acc, b) => acc + b.byteLength, 0);
						const combined = new Uint8Array(totalLen);
						let offset = 0;
						for (const b of buffers) {
							combined.set(new Uint8Array(b), offset);
							offset += b.byteLength;
						}
						wasmBuffer = combined.buffer;
						console.log(`Successfully combined split parts (${wasmBuffer.byteLength} bytes)`);
					}
					console.log("Compiling WebAssembly compiler module...");
					compiledCompilerModule = await WebAssembly.compile(wasmBuffer);
					console.log("WebAssembly compiler module compiled successfully!");
				})();

				const jsFetchPromise = fetch('build/c3c.js').then(res => {
					if (!res.ok) throw new Error('Failed to fetch c3c.js');
					return res.text();
				}).then(text => {
					c3cJsText = text;
					console.log("Successfully loaded build/c3c.js text (" + text.length + " chars)");
				});

				const dataFetchPromise = fetch('build/c3c.data').then(res => {
					if (!res.ok) throw new Error('Failed to fetch c3c.data');
					return res.arrayBuffer();
				}).then(buf => {
					c3cDataBuffer = buf;
					console.log("Successfully loaded build/c3c.data buffer (" + buf.byteLength + " bytes)");
				});

				const workerJsFetchPromise = fetch('c3-worker.js').then(res => {
					if (!res.ok) throw new Error('Failed to fetch c3-worker.js');
					return res.text();
				}).then(text => {
					c3WorkerJsText = text;
					console.log("Successfully loaded c3-worker.js text (" + text.length + " chars)");
				});

				setStatus("Downloading files...", "");
				await Promise.all([wasmFetchPromise, jsFetchPromise, dataFetchPromise, workerJsFetchPromise]);

				queryCompilerVersion().then(() => {
					setStatus("Compiler Ready", "ready");
					compileBtn.disabled = false;
					triggerSilentDocgen();
				});

			} catch (err) {
				console.error("Fatal initialization error:", err);
				setStatus("Initialization Failed", "");
				outputEl.textContent += "\n[Fatal Error] Failed to initialize compiler: " + err.message + "\n";
				compileBtn.disabled = true;
			}
		}

		function triggerSilentDocgen() {
			if (!editor) return;
			const codeValue = editor.getValue();

			executeCompilerTask(
				"docgen",
				codeValue,
				(msg, tempWorker) => {
					switch (msg.type) {
						case "doc_db":
							docDbSymbols = flattenDocgen(msg.db);
							break;
						case "docgen_failed":
							docDbSymbols = [];
							break;
					}
					return true;
				}
			);
		}

		compileBtn.onclick = () => {
			if (!editor || isAnyCompilerTaskRunning) {
				if (isAnyCompilerTaskRunning) console.warn("[Compile Button] Ignoring click: another task is already running.");
				return;
			}
			const codeValue = editor.getValue();
			console.log("Compile button clicked. Source length:", codeValue.length);

			rawConsoleOutput = "";
			outputEl.innerHTML = "";
			monaco.editor.setModelMarkers(editor.getModel(), "c3", []);

			let compileStderrBuffer = [];

			executeCompilerTask(
				"compile",
				codeValue,
				async (msg, tempWorker) => {
					switch (msg.type) {
						case "stdout":
							rawConsoleOutput += msg.text;
							outputEl.innerHTML = formatConsoleOutput(rawConsoleOutput);
							break;
						case "stderr":
							rawConsoleOutput += "[ERR] " + msg.text;
							compileStderrBuffer.push(msg.text);
							outputEl.innerHTML = formatConsoleOutput(rawConsoleOutput);
							break;
						case "compiled":
							outputEl.innerHTML += "\n[WASM Linked: " + msg.wasm.byteLength + " bytes]\n";
							await runEmscriptenProgram(msg.wasm);

							const successMarkers = parseCompilerErrors(compileStderrBuffer.join('\n'));
							monaco.editor.setModelMarkers(editor.getModel(), "c3", successMarkers);

							triggerSilentDocgen();
							return true;
						case "failed":
							outputEl.innerHTML += "\n[Compilation Failed]\n" + msg.error + "\n";

							const failMarkers = parseCompilerErrors(compileStderrBuffer.join('\n'));
							monaco.editor.setModelMarkers(editor.getModel(), "c3", failMarkers);
							return true;
					}
					return false;
				}
			);
		};

		outputEl.addEventListener('click', (e) => {
			const target = e.target;
			if (target && target.classList.contains('console-link')) {
				const line = parseInt(target.getAttribute('data-line'), 10);
				const col = parseInt(target.getAttribute('data-col'), 10);
				if (editor && line) {
					console.log(`[Main Thread] Navigating editor to clicked console coordinate: line ${line}, col ${col}`);
					editor.revealLineInCenter(line);
					editor.setPosition({ lineNumber: line, column: col });
					editor.focus();
				}
			}
		});

		clearBtn.onclick = () => {
			outputEl.textContent = "";
			docDbSymbols = [];
			monaco.editor.setModelMarkers(editor.getModel(), "c3", []);
		};

		statusEl.onclick = () => {
			if (statusEl.classList.contains("ready")) {
				console.log("Manual compiler reset requested via status badge. Forcing symbol refresh and UI reset.");
				outputEl.textContent = "Refreshing compiler context and symbols...\n";
				docDbSymbols = [];
				monaco.editor.setModelMarkers(editor.getModel(), "c3", []);
				if (!isAnyCompilerTaskRunning) {
					triggerSilentDocgen();
				} else {
					console.warn("[Reset Badge] A task is currently running. New symbol refresh will occur after it completes.");
				}
			}
		};

		// Layout Panel Resizing Mechanics
		let isDragging = false;

		resizer.addEventListener("mousedown", (e) => {
			isDragging = true;
			resizer.classList.add("dragging");
			document.body.style.cursor = window.innerWidth <= 768 ? "row-resize" : "col-resize";
			document.body.style.userSelect = "none";
			e.preventDefault();
		});

		document.addEventListener("mousemove", (e) => {
			if (!isDragging) return;
			const containerRect = mainLayout.getBoundingClientRect();
			const isMobile = window.innerWidth <= 768;

			if (isMobile) {
				const topHeight = e.clientY - containerRect.top;
				topPercentage = (topHeight / containerRect.height) * 100;
				topPercentage = Math.max(15, Math.min(85, topPercentage));

				mainLayout.style.gridTemplateRows = `${topPercentage}% 10px 1fr`;
				mainLayout.style.gridTemplateColumns = "1fr";
			} else {
				const leftWidth = e.clientX - containerRect.left;
				leftPercentage = (leftWidth / containerRect.width) * 100;
				leftPercentage = Math.max(15, Math.min(85, leftPercentage));

				mainLayout.style.gridTemplateColumns = `${leftPercentage}% 10px 1fr`;
				mainLayout.style.gridTemplateRows = "1fr";
			}

			if (editor) {
				editor.layout();
			}
		});

		document.addEventListener("mouseup", () => {
			if (isDragging) {
				isDragging = false;
				resizer.classList.remove("dragging");
				document.body.style.cursor = "";
				document.body.style.userSelect = "";

				if (window.innerWidth <= 768) {
					localStorage.setItem("c3_playground_top_percentage", topPercentage.toFixed(2));
				} else {
					localStorage.setItem("c3_playground_left_percentage", leftPercentage.toFixed(2));
				}
			}
		});

		copyBtn.onclick = () => {
			if (!editor) return;
			const codeValue = editor.getValue();
			navigator.clipboard.writeText(codeValue).then(() => {
				const originalHTML = copyBtn.innerHTML;
				const originalTitle = copyBtn.title;

				copyBtn.innerHTML = `
			<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<polyline points="20 6 9 17 4 12"></polyline>
			</svg>
		`;
				copyBtn.title = "Copied!";

				setTimeout(() => {
					copyBtn.innerHTML = originalHTML;
					copyBtn.title = originalTitle;
				}, 1500);
			}).catch(err => {
				console.error("Failed to copy code to clipboard: ", err);
			});
		};

		shareBtn.onclick = async () => {
			if (!editor) return;
			const codeValue = editor.getValue();
			const encoded = await compressCode(codeValue);
			const shareUrl = `${window.location.origin}${window.location.pathname}#code=${encoded}`;

			navigator.clipboard.writeText(shareUrl).then(() => {
				const originalHTML = shareBtn.innerHTML;
				const originalTitle = shareBtn.title;

				shareBtn.innerHTML = `
			<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<polyline points="20 6 9 17 4 12"></polyline>
			</svg>
		`;
				shareBtn.title = "Link Copied!";

				history.replaceState(null, null, `#code=${encoded}`);

				setTimeout(() => {
					shareBtn.innerHTML = originalHTML;
					shareBtn.title = originalTitle;
				}, 1500);
			}).catch(err => {
				console.error("Failed to copy share link to clipboard: ", err);
			});
		};

		saveBtn.onclick = () => {
			saveCodeToDisk();
		};

		function saveCodeToDisk() {
			if (!editor) return;
			const codeValue = editor.getValue();
			const blob = new Blob([codeValue], { type: 'text/plain;charset=utf-8' });
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url;
			a.download = 'main.c3';
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
			console.log("Saved main.c3 to local file system.");
		}

		async function runEmscriptenProgram(wasmBuffer) {
			console.log("Running user program WASM buffer...");
			rawConsoleOutput += "Executing WASM program...\n";
			outputEl.innerHTML = formatConsoleOutput(rawConsoleOutput);

			let instance = null;
			try {
				instance = await C3EmscriptenRuntime({
					wasmBinary: wasmBuffer,
					print(text) {
						rawConsoleOutput += text + "\n";
						outputEl.innerHTML = formatConsoleOutput(rawConsoleOutput);
					},
					printErr(text) {
						rawConsoleOutput += "[ERR] " + text + "\n";
						outputEl.innerHTML = formatConsoleOutput(rawConsoleOutput);
					},
					onExit(code) {
						rawConsoleOutput += "\nProgram exited with code: " + code + "\n";
						outputEl.innerHTML = formatConsoleOutput(rawConsoleOutput);
					},
					noInitialRun: true,
				});

				const mainFn = instance.wasmExports?.main || instance.wasmExports?.['__main_argc_argv'];
				if (mainFn) {
					console.log("Main function found. Executing...");
					const ret = mainFn(0, 0);
					rawConsoleOutput += "\n[Process finished with exit code " + ret + "]\n";
					outputEl.innerHTML = formatConsoleOutput(rawConsoleOutput);
				} else {
					rawConsoleOutput += "[ERR] Entry point 'main' not found in WASM exports\n";
					outputEl.innerHTML = formatConsoleOutput(rawConsoleOutput);
				}
			} catch (err) {
				console.error("Execution error:", err);
				rawConsoleOutput += "\n[Execution Error] " + err + "\n";
				outputEl.innerHTML = formatConsoleOutput(rawConsoleOutput);
			} finally {
				instance = null;
			}
		}
	</script>
