<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>C3 Playground</title>
	<link rel="icon" type="image/svg+xml" href="./favicon.svg">
	<style>
		:root {
			--bg-dark: #0f172a;
			--panel-bg: #1e293b;
			--border: #334155;
			--accent: #38bdf8;
			--accent-hover: #0284c7;
			--text-main: #f8fafc;
			--text-muted: #94a3b8;
			--console-bg: #090d16;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: var(--bg-dark);
			color: var(--text-main);
			height: 100vh;
			display: flex;
			flex-direction: column;
		}

		header {
			background-color: var(--panel-bg);
			border-bottom: 1px solid var(--border);
			padding: 12px 24px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		header h1 img {
			height: 50px;
			width: auto;
		}

		header h1 {
			font-size: 1.25rem;
			font-weight: 600;
			color: var(--accent);
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
		}

		.docs-link {
			font-size: 0.85rem;
			color: var(--text-muted);
			text-decoration: none;
			font-weight: normal;
			display: inline-flex;
			align-items: center;
			gap: 4px;
			transition: color 0.2s ease;
		}

		.docs-link:hover {
			color: var(--accent);
		}

		.controls {
			display: flex;
			gap: 12px;
			align-items: center;
		}

		select,
		button {
			font-size: 0.9rem;
			padding: 8px 16px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--bg-dark);
			color: var(--text-main);
			cursor: pointer;
			transition: all 0.2s ease;
		}

		select:focus,
		button:focus {
			outline: none;
			border-color: var(--accent);
		}

		button.primary {
			background-color: var(--accent);
			color: #0f172a;
			font-weight: 600;
			border: none;
		}

		button.primary:hover:not(:disabled) {
			background-color: var(--accent-hover);
			color: #fff;
		}

		button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.status-container {
			position: relative;
			display: inline-flex;
			align-items: center;
		}

		.status-badge {
			font-size: 0.8rem;
			padding: 4px 8px;
			border-radius: 12px;
			background: #334155;
			color: var(--text-muted);
			transition: all 0.2s ease;
			user-select: none;
		}

		.status-badge.ready {
			background: #064e3b;
			color: #34d399;
			cursor: pointer;
		}

		.status-badge.ready:hover {
			background: #047857;
			color: #10b981;
		}

		.status-badge.compiling {
			background: #78350f;
			color: #fbbf24;
		}

		.status-tooltip {
			opacity: 0;
			visibility: hidden;
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			background-color: #0b1329;
			border: 1px solid var(--border);
			color: #e2e8f0;
			padding: 12px;
			border-radius: 6px;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 0.75rem;
			line-height: 1.5;
			white-space: pre;
			z-index: 1000;
			box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.6), 0 4px 6px -4px rgba(0, 0, 0, 0.6);
			pointer-events: none;
			transition: opacity 0.2s ease, visibility 0.2s ease;
		}

		.status-container:hover .status-badge.ready~.status-tooltip {
			opacity: 1;
			visibility: visible;
		}

		.settings-container {
			position: relative;
			display: inline-flex;
			align-items: center;
		}

		.settings-btn {
			padding: 8px;
			background: var(--bg-dark);
			border: 1px solid var(--border);
			border-radius: 6px;
			color: var(--text-main);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.settings-btn:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		.settings-popover {
			display: none;
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			width: 320px;
			background: #0b1329;
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 16px;
			z-index: 1000;
			box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
			flex-direction: column;
			gap: 8px;
		}

		.settings-popover.active {
			display: flex;
		}

		.popover-header {
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--accent);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-bottom: 2px;
		}

		.settings-popover label {
			font-size: 0.8rem;
			color: var(--text-muted);
		}

		.settings-popover input {
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 0.85rem;
			padding: 8px 10px;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--panel-bg);
			color: var(--text-main);
			width: 100%;
		}

		.settings-popover input:focus {
			outline: none;
			border-color: var(--accent);
		}

		.popover-help {
			font-size: 0.75rem;
			color: var(--text-muted);
			line-height: 1.4;
		}

		main {
			flex: 1;
			display: grid;
			grid-template-columns: 1fr 10px 1fr;
			padding: 12px;
			overflow: hidden;
			box-sizing: border-box;
		}

		.pane {
			background: var(--panel-bg);
			border: 1px solid var(--border);
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.resizer {
			width: 10px;
			cursor: col-resize;
			background: transparent;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 10;
			user-select: none;
		}

		.resizer::after {
			content: "";
			width: 2px;
			height: 40px;
			background-color: var(--border);
			border-radius: 1px;
			transition: background-color 0.2s ease, height 0.2s ease, width 0.2s ease;
		}

		.resizer:hover::after,
		.resizer.dragging::after {
			background-color: var(--accent);
			height: 100%;
		}

		.pane-header {
			background: rgba(15, 23, 42, 0.4);
			padding: 8px 16px;
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--text-muted);
			border-bottom: 1px solid var(--border);
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.editor-actions {
			display: flex;
			gap: 8px;
		}

		.icon-btn {
			background: transparent;
			border: none;
			color: var(--text-muted);
			padding: 4px;
			cursor: pointer;
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s ease;
		}

		.icon-btn:hover {
			color: var(--accent);
			background: rgba(56, 189, 248, 0.1);
		}

		.icon-btn svg {
			width: 16px;
			height: 16px;
		}

		#code {
			flex: 1;
			width: 100%;
			min-height: 0;
		}

		pre {
			flex: 1;
			background: var(--console-bg);
			color: #38bdf8;
			font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace;
			font-size: 13px;
			line-height: 1.5;
			padding: 16px;
			overflow-y: auto;
			white-space: pre-wrap;
			word-break: break-all;
			-webkit-overflow-scrolling: touch;
		}

		#canvasContainer {
			position: relative;
			display: none;
			background: #090d16;
			border-bottom: 1px solid var(--border);
			resize: vertical;
			overflow: hidden;
			height: 481px;
			min-height: 80px;
			max-height: 95%;
		}

		#canvasContainer:fullscreen {
			border: none;
			max-height: none;
			background: #000;
		}

		.canvas-wrapper {
			display: flex;
			width: 100%;
			height: 100%;
			padding: 6px;
			align-items: center;
			justify-content: center;
			box-sizing: border-box;
		}

		#canvas {
			background: #000;
			border: 1px solid var(--border);
			image-rendering: auto;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		.canvas-fullscreen-btn {
			position: absolute;
			top: 12px;
			right: 12px;
			background: rgba(15, 23, 42, 0.85);
			border: 1px solid var(--border);
			color: var(--text-main);
			border-radius: 6px;
			padding: 6px;
			cursor: pointer;
			opacity: 0;
			transition: opacity 0.2s ease, background-color 0.2s ease, color 0.2s ease;
			z-index: 20;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		#canvasContainer:hover .canvas-fullscreen-btn {
			opacity: 1;
		}

		@media (hover: none),
		(pointer: coarse) {
			.canvas-fullscreen-btn {
				opacity: 1;
				background: rgba(15, 23, 42, 0.75);
			}
		}

		.canvas-fullscreen-btn:hover {
			background: var(--accent);
			color: #0f172a;
		}

		@media (max-width: 768px) {
			#canvasContainer {
				height: 140px;
			}
		}

		.console-link:hover {
			text-decoration: underline !important;
			color: #0284c7 !important;
		}

		@media (max-width: 768px) {
			main {
				grid-template-columns: 1fr !important;
				grid-template-rows: 1fr 10px 1fr;
			}

			.resizer {
				width: 100%;
				height: 10px;
				cursor: row-resize;
			}

			.resizer::after {
				width: 40px;
				height: 2px;
			}

			.resizer:hover::after,
			.resizer.dragging::after {
				width: 100%;
				height: 2.2px;
			}
		}

		@media (max-width: 480px) {
			header {
				padding: 12px;
				flex-direction: column;
				gap: 12px;
				align-items: stretch;
			}

			.controls {
				width: 100%;
				justify-content: space-between;
			}

			select {
				flex: 1;
				max-width: 150px;
			}
		}
	</style>
</head>

<body>

	<header>
		<h1>
			<img src="favicon.svg" alt="C3 Logo">
			<span>Playground</span>
			<a href="https://c3-lang.org/standard-library/docs.html" target="_blank" class="docs-link"
				title="Open C3 Standard Library Documentation">
				<span>Stdlib Docs</span>
				<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					stroke-linecap="round" stroke-linejoin="round">
					<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
					<polyline points="15 3 21 3 21 9"></polyline>
					<line x1="10" y1="14" x2="21" y2="3"></line>
				</svg>
			</a>
		</h1>
		<div class="controls">
			<select id="exampleSelect">
				<option value="" disabled selected hidden>Examples...</option>
			</select>

			<div class="status-container">
				<span id="status" class="status-badge">Loading...</span>
				<pre id="statusTooltip" class="status-tooltip">Fetching version...</pre>
			</div>

			<div class="settings-container">
				<button id="settingsBtn" class="settings-btn" title="Compiler Settings" aria-label="Compiler Settings">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="3"></circle>
						<path
							d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
						</path>
					</svg>
				</button>
				<div id="settingsPopover" class="settings-popover">
					<div class="popover-header">Compiler Flags</div>
					<label for="extraFlagsInput">Extra Arguments:</label>
					<input type="text" id="extraFlagsInput" placeholder="-O3 --safe=yes -D FOO" spellcheck="false"
						autocomplete="off">
					<span class="popover-help">Additional flags passed directly to <code>c3c compile</code>.</span>
				</div>
			</div>

			<button id="compileBtn" class="primary" title="Compile & Run (Ctrl+Enter)" disabled>Compile & Run</button>
		</div>
	</header>

	<main id="mainLayout">
		<div class="pane">
			<div class="pane-header">
				<span>SOURCE CODE (C3)</span>
				<div class="editor-actions">
					<button id="shareBtn" title="Share Code" class="icon-btn">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<circle cx="18" cy="5" r="3"></circle>
							<circle cx="6" cy="12" r="3"></circle>
							<circle cx="18" cy="19" r="3"></circle>
							<line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
							<line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
						</svg>
					</button>
					<button id="copyBtn" title="Copy Code" class="icon-btn">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
							<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
						</svg>
					</button>
					<button id="saveBtn" title="Save File (Ctrl+S)" class="icon-btn">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
							<polyline points="17 21 17 13 7 13 7 21"></polyline>
							<polyline points="7 3 7 8 15 8"></polyline>
						</svg>
					</button>
				</div>
			</div>
			<div id="code"></div>
		</div>

		<div class="resizer" id="resizer"></div>

		<div class="pane">
			<div class="pane-header">
				<span>CONSOLE OUTPUT</span>
				<button id="clearBtn" title="Clear console and stop execution" class="icon-btn"
					aria-label="Clear console and stop execution">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
						stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
						<line x1="10" y1="11" x2="10" y2="17"></line>
						<line x1="14" y1="11" x2="14" y2="17"></line>
					</svg>
				</button>
			</div>
			<div id="canvasContainer">
				<button id="canvasFullscreenBtn" class="canvas-fullscreen-btn" title="Toggle Fullscreen"
					aria-label="Toggle Fullscreen">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<path
							d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
						</path>
					</svg>
				</button>
				<div class="canvas-wrapper">
					<canvas id="canvas"></canvas>
				</div>
			</div>
			<pre id="output"></pre>
		</div>
	</main>

	<script src="build/emscripten_runtime.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs/loader.js"></script>
	<script type="module" src="js/main.js"></script>
</body>

</html>
